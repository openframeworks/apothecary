name: Platform binary artifacts
description: Restore compatible formula outputs or publish a complete trusted baseline
inputs:
  phase:
    description: restore or save
    required: true
  variant:
    description: Architecture/flavor or Apple bundle number
    required: true
  archs:
    description: All architectures built by this job
    required: true
  shell:
    description: Runner shell (msys2 for MinGW jobs)
    default: bash
runs:
  using: composite
  steps:
    - name: Fingerprint formula inputs
      if: inputs.phase == 'restore'
      shell: ${{ inputs.shell }}
      env:
        OPTIONAL_ARCHS: ${{ inputs.archs }}
      run: |
        artifact_temp="$RUNNER_TEMP"
        if command -v cygpath >/dev/null 2>&1; then
          artifact_temp=$(cygpath -u "$artifact_temp")
        fi
        # Cold caches still need the staging directory before listing/building.
        mkdir -p out
        bash scripts/platform-artifact-manifest.sh > "$artifact_temp/platform-artifact-keys.tsv"
    - name: Find trusted platform baseline
      if: inputs.phase == 'restore'
      id: baseline
      uses: actions/github-script@v9.0.0
      env:
        ARTIFACT_VARIANT: ${{ inputs.variant }}
      with:
        script: |
          await require(`${process.env.GITHUB_WORKSPACE}/scripts/platform-artifacts.cjs`).select({github, context, core});
    - name: Download platform baseline
      if: inputs.phase == 'restore' && steps.baseline.outputs.run-id != ''
      uses: actions/download-artifact@v8.0.2
      with:
        github-token: ${{ github.token }}
        run-id: ${{ steps.baseline.outputs.run-id }}
        name: ${{ steps.baseline.outputs.name }}
        path: ${{ runner.temp }}/platform-artifact-download
    - name: Extract baseline
      if: inputs.phase == 'restore' && steps.baseline.outputs.run-id != ''
      shell: ${{ inputs.shell }}
      run: |
        artifact_temp="$RUNNER_TEMP"
        if command -v cygpath >/dev/null 2>&1; then
          artifact_temp=$(cygpath -u "$artifact_temp")
        fi
        mkdir -p "$artifact_temp/platform-artifact-output"
        tar -xzf "$artifact_temp/platform-artifact-download/platform-binaries.tar.gz" -C "$artifact_temp/platform-artifact-output"
    - name: Restore matching formulas
      if: inputs.phase == 'restore' && steps.baseline.outputs.run-id != ''
      uses: actions/github-script@v9.0.0
      with:
        script: |
          require(`${process.env.GITHUB_WORKSPACE}/scripts/platform-artifacts.cjs`).restore({core});
    - name: Package complete platform output
      if: inputs.phase == 'save'
      shell: ${{ inputs.shell }}
      run: |
        artifact_temp="$RUNNER_TEMP"
        if command -v cygpath >/dev/null 2>&1; then
          artifact_temp=$(cygpath -u "$artifact_temp")
        fi
        cp "$artifact_temp/platform-artifact-keys.tsv" out/.platform-artifact-keys.tsv
        tar -czf "$artifact_temp/platform-binaries.tar.gz" -C out .
    - name: Upload trusted platform baseline
      if: inputs.phase == 'save'
      uses: actions/upload-artifact@v7.0.2
      with:
        name: platform-v1-${{ env.TARGET }}-${{ inputs.variant }}
        path: ${{ runner.temp }}/platform-binaries.tar.gz
        if-no-files-found: error
        retention-days: 30
