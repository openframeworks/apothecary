name: build-linux-sndfile-modular
on:
  pull_request:
    paths: ['apothecary/formulas/sndfile/**', '.github/workflows/build-linux-sndfile-modular.yml', 'scripts/modular-cache-key.sh', 'scripts/package-individual.sh', 'scripts/export_config.sh', 'apothecary/apothecary']
  push:
    branches: [bleeding, master]
    paths: ['apothecary/formulas/sndfile/**', '.github/workflows/build-linux-sndfile-modular.yml', 'scripts/modular-cache-key.sh', 'scripts/package-individual.sh', 'scripts/export_config.sh', 'apothecary/apothecary']
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ startsWith(github.ref, 'refs/tags/') && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
permissions:
  contents: write
jobs:
  build:
    name: sndfile Linux ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: '64', runner: ubuntu-24.04}
          - {arch: arm64, runner: ubuntu-24.04-arm}
    runs-on: ${{ matrix.runner }}
    env:
      TARGET: linux
      TYPE: linux
      ARCH: ${{ matrix.arch }}
      GCC: gcc14
      GCC_VERSION: '14'
      CC: gcc-14
      CXX: g++-14
      NO_COLOR: '1'
      UI_ANIM: '0'
      NO_FORCE: '1'
      PACKAGE_LIBS: sndfile
      ALWAYS_BUILD: '1'
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake build-essential cmake curl gcc-14 g++-14 git libtool pkg-config python3-venv unzip libflac-dev libogg-dev libvorbis-dev libopus-dev libmpg123-dev libmp3lame-dev
          python3 -m venv "$RUNNER_TEMP/build-tools"
          "$RUNNER_TEMP/build-tools/bin/pip" install meson==1.12.1 ninja packaging mako pyyaml
          echo "$RUNNER_TEMP/build-tools/bin" >> "$GITHUB_PATH"
      - name: Record exact native build context
        run: |
          context="$RUNNER_TEMP/sndfile-context"
          {
            "$CC" --version
            "$CXX" --version
            cmake --version
            meson --version
            ninja --version
            dpkg-query -W
            git hash-object .github/workflows/build-linux-sndfile-modular.yml
          } > "$context"
          echo "PLATFORM_ARTIFACT_CONTEXT=$context" >> "$GITHUB_ENV"
      - name: Compute modular cache key
        id: key
        run: bash scripts/modular-cache-key.sh sndfile >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v5
        id: cache
        with:
          key: ${{ steps.key.outputs.key }}
          path: out/sndfile
      - name: Build library
        if: steps.cache.outputs.cache-hit != 'true'
        run: ./apo update sndfile
      - name: Check headers, pkg-config and target linking
        run: |
          export PKG_CONFIG_PATH="$PWD/out/sndfile/lib/linux/$ARCH/pkgconfig"
          test -f "$PKG_CONFIG_PATH/sndfile.pc"
          pkg-config --exists sndfile
          printf '#include <sndfile.h>\nint main(void) { (void)sf_version_string(); return 0; }\n' > "$RUNNER_TEMP/sndfile-smoke.c"
          "$CC" "$RUNNER_TEMP/sndfile-smoke.c" $(pkg-config --cflags --libs sndfile) -o "$RUNNER_TEMP/sndfile-smoke"
          export LD_LIBRARY_PATH="$PWD/out/sndfile/lib/linux/$ARCH:$PWD/out/sndfile/lib/linux/$ARCH/pulseaudio:${LD_LIBRARY_PATH:-}"
          "$RUNNER_TEMP/sndfile-smoke"
      - name: Package modular library
        run: bash scripts/package-individual.sh
      - uses: actions/cache/save@v5
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          key: ${{ steps.key.outputs.key }}
          path: out/sndfile
      - uses: actions/upload-artifact@v7
        with:
          name: sndfile-linux-${{ matrix.arch }}-gcc14
          path: out/oF_sndfile_linux_${{ matrix.arch }}_gcc14.tar.bz2
          if-no-files-found: error
      - name: Publish latest-modular asset
        if: github.event_name == 'push' && github.repository == 'openframeworks/apothecary'
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
        run: gh release upload latest-modular "out/oF_sndfile_linux_${ARCH}_gcc14.tar.bz2" --clobber --repo "$GITHUB_REPOSITORY"
