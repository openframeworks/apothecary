name: build-macos

on:
  push:
    paths-ignore:
      - '**/README.md'
  pull_request:
    paths-ignore:
      - '**/README.md'
      
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  TARGET: "osx"
  NO_FORCE: 1
  GA_CI_SECRET: ${{ secrets.CI_SECRET }}
  USE_ARTIFACT: true
  DISABLE_WORKFLOW: "false"

jobs:  
  pre-check:
    runs-on: ubuntu-latest
    outputs:
      workflow_disabled: ${{ steps.check-disabled.outputs.disabled }}
    steps:
    - name: Check if Workflow is disabled
      id: check-disabled
      shell: bash
      run: |
        if [ "${{ env.DISABLE_WORKFLOW }}" == "true" ]; then
          echo "disabled=true" >> $GITHUB_ENV
          echo "::set-output name=disabled::true"
        else
          echo "::set-output name=disabled::false"
        fi
  build-macos-platforms:
    if: needs.pre-check.outputs.workflow_disabled != 'true'
    runs-on: macos-14
    needs: pre-check
    strategy:
      matrix:
        bundle: [1, 2, 3]
    env:
      BUNDLE: ${{ matrix.bundle }}
      DEVELOPER_DIR: "/Applications/Xcode_16.2.app/Contents/Developer"
    steps:
      - name: Determine Release
        id: vars
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "RELEASE=${{ github.ref_name }}" >> $GITHUB_ENV
          elif [[ "${{ github.ref }}" == "refs/heads/master" ]]; then
            echo "RELEASE=nightly" >> $GITHUB_ENV
          elif [[ "${{ github.ref }}" == "refs/heads/bleeding" ]]; then
            echo "RELEASE=latest" >> $GITHUB_ENV
          else
            echo "RELEASE=latest" >> $GITHUB_ENV
          fi
      - uses: actions/checkout@v7.0.1
      - name: Scripts Calc Formula - ${{ env.TARGET }} Bundle ${{ matrix.bundle }}
        run: ./scripts/calculate_formulas.sh
      - name: Scripts Install
        run: ./scripts/osx/install.sh
      - name: 'Download artifacts'
        uses: actions/github-script@v9.0.0
        if: env.USE_ARTIFACT == 'true'
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const outputDir = path.join(process.env.GITHUB_WORKSPACE, 'out');
            if (!fs.existsSync(outputDir)){
              fs.mkdirSync(outputDir);
            }
            // https://api.github.com/repos/openframeworks/apothecary/actions/artifacts?per_page=250
            const artifacts = await github.rest.actions.listArtifactsForRepo({
              owner: context.repo.owner,
              repo: 'apothecary',
              sort: 'created_at',
              direction: 'desc',
              per_page: 150
            });
            const target = process.env.TARGET;
            const bundle = process.env.MATRIX_BUNDLE;
            const release = '${{ github.ref }}'.startsWith('refs/tags/') ? 'latest' : process.env.RELEASE;
            const artifactName1 = `libs-${release}-${target}-1`;
            const artifactName2 = `libs-${release}-${target}-2`;
            const artifactName3 = `libs-${release}-${target}-3`;
            const artifactNamesToDownload = new Set([artifactName1, artifactName2, artifactName3]);                      
            let count = 0;
            const max = 3;
            for (const artifact of artifacts.data.artifacts) {
              const isArtifactMatch = artifact.name.includes(`libs-${release}-${target}`) && !artifact.expired;
              if (isArtifactMatch) {
                const download = await github.rest.actions.downloadArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id,
                  archive_format: 'zip',
                });
                const artifactPath = path.join(outputDir, `${artifact.name}.zip`);
                fs.writeFileSync(artifactPath, Buffer.from(download.data));
                console.log(`Downloaded ${artifact.name} to ${artifactPath}`);
                count++;
                if (count >= max) {
                  break;
                }
              }
            }
      - name: Extract Artifacts to /out
        if: env.USE_ARTIFACT == 'true'
        run: |
            mkdir -p out
            if ls out/*.zip 1> /dev/null 2>&1; then
              for zip in out/*.zip; do
                  echo "Extracting $zip..."
                  unzip -o "$zip" -d out/
              done
              echo "Extraction complete."
              rm out/*.zip
            else
              echo "No zip files to extract."
            fi
            if ls out/*.tar.bz2 1> /dev/null 2>&1; then
              for tarball in out/*.tar.bz2; do
                  echo "Extracting $tarball..."
                  tar -xjf "$tarball" -C out/
              done
              echo ".tar.bz2 extraction complete."
              rm -f out/*.tar.bz2
            else
              echo "No .tar.bz2 files to extract."
            fi
            rm -f xout/*.tar.bz2 
            rm -f out/*.tar.bz2
      - name: List output directory1
        run: ls -lah out/
      - name: Build macOS x86_64
        working-directory: ${{ env.GITHUB_WORKSPACE }}
        run: scripts/build.sh
        env:
          BUNDLE: ${{ matrix.bundle }}
          ARCH: x86_64
      - name: Build macOS arm64
        working-directory: ${{ env.GITHUB_WORKSPACE }}
        run: scripts/build.sh
        env:
          BUNDLE: ${{ matrix.bundle }}
          ARCH: arm64
      - name: List output directory
        run: ls -lah out/
      - name: Cleanup out of bundle
        working-directory: ${{ env.GITHUB_WORKSPACE }}
        run: scripts/artifact/artifact-clean.sh
        env:
          BUNDLE: ${{ matrix.bundle }}
      - name: List output directory2
        run: ls -lah out/

      # - name: Build Poco
      #   run: ./apothecary/apothecary -tosx -ax86_64 update poco

      - name: Package Binaries for Artifact
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/bleeding')
        working-directory: ${{ env.GITHUB_WORKSPACE }}
        run: scripts/artifact/artifact.sh
        env:
          BUNDLE: ${{ matrix.bundle }}
          GA_CI_SECRET: ${{ secrets.CI_SECRET }}
      - name: Upload binaries as Artifact
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/bleeding')
        uses: actions/upload-artifact@v7.0.0
        with:
          name: libs-${{ env.RELEASE }}-${{ env.TARGET }}-${{ matrix.bundle }}
          path: out/openFrameworksLibs_${{ env.RELEASE }}_${{ env.TARGET }}_${{ matrix.bundle }}.tar.bz2
          retention-days: 31

      - name: Remove .tar.bz2 files
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/bleeding' )
        run: |
          echo "Removing .tar.bz2 files from out/ directory..."
          rm -f out/*.tar.bz2
          rm -f xout/*.tar.bz2
          echo "Cleanup complete."

      - name: Merge our libraries into XC Framework 
        working-directory: ${{ env.GITHUB_WORKSPACE }}
        run: scripts/osx/xcframework_all.sh
        env:
          BUNDLE: ${{ matrix.bundle }}

      - name: Package Individual Modular Libraries (macOS)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/bleeding' || contains(github.ref, 'refs/tags/')) && matrix.bundle == 3
        working-directory: ${{ env.GITHUB_WORKSPACE }}
        run: |
          scripts/package-individual.sh
        env:
          GA_CI_SECRET: ${{ secrets.CI_SECRET }}

      - name: List output directory before modular upload
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/bleeding' || contains(github.ref, 'refs/tags/')) && matrix.bundle == 3
        run: ls -lah xout/

      # ── Clean before latest-modular upload (macOS) ─────────────────────────
      - name: Clean before latest-modular upload
        if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/bleeding') && matrix.bundle == 3
        run: |
          echo "🧹 Cleaning any existing openFrameworksLibs* files before latest-modular upload..."
          rm -f xout/openFrameworksLibs*.tar.bz2
          echo "Files remaining in xout/:"
          ls -lah xout/

      - name: Upload to GitHub Release (latest-modular)
        if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/bleeding') && matrix.bundle == 3
        uses: softprops/action-gh-release@v3.0.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: "latest-modular"
          files: xout/*.tar.bz2

      - name: Remove .tar.bz2 files
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/bleeding' )
        run: |
          echo "Removing .tar.bz2 files from out/ directory..."
          rm -f out/*.tar.bz2
          rm -f xout/*.tar.bz2
          echo "Cleanup complete."

      - name: Package final
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/bleeding' || contains(github.ref, 'refs/tags/'))
        working-directory: ${{ env.GITHUB_WORKSPACE }}
        run: scripts/package.sh
        env:
          BUNDLE: ${{ matrix.bundle }}
      - name: Package PR smoke-test libraries
        if: github.event_name == 'pull_request'
        working-directory: ${{ env.GITHUB_WORKSPACE }}
        run: scripts/package.sh
        env:
          ALWAYS_BUILD: 1
          BUNDLE: ${{ matrix.bundle }}
      - name: Upload PR smoke-test libraries
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7.0.0
        with:
          name: pr-libraries-osx-${{ matrix.bundle }}
          path: xout/openFrameworksLibs_latest_osx_${{ matrix.bundle }}.tar.bz2
          if-no-files-found: error
          retention-days: 7
      - name: Update Release XCFramework
        if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/bleeding')
        uses: softprops/action-gh-release@v3.0.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ env.RELEASE }}
          release: ${{ env.RELEASE }}
          files: xout/openFrameworksLibs_${{ env.RELEASE }}_${{ env.TARGET }}_${{ matrix.bundle }}.tar.bz2

  smoke-test-openframeworks:
    name: Smoke test PR libraries in openFrameworks
    if: github.event_name == 'pull_request'
    needs: build-macos-platforms
    runs-on: macos-14
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
      OF_ROOT: ${{ github.workspace }}/openFrameworks
    steps:
      - name: Check out Apothecary test scripts
        uses: actions/checkout@v7.0.1
        with:
          path: apothecary-tests

      - name: Check out openFrameworks
        uses: actions/checkout@v7.0.1
        with:
          repository: openframeworks/openFrameworks
          ref: master
          submodules: recursive
          path: openFrameworks

      - name: Download PR library bundles
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: pr-libraries-osx-*
          path: pr-libraries
          merge-multiple: true

      - name: Deploy PR libraries into openFrameworks
        run: bash apothecary-tests/scripts/deploy-openframeworks-artifacts.sh "$OF_ROOT" "$GITHUB_WORKSPACE/pr-libraries" osx

      - name: Build openFrameworks macOS smoke test
        working-directory: openFrameworks
        env:
          TRAVIS_BUILD_DIR: ${{ github.workspace }}/openFrameworks
        run: scripts/ci/osx/build.sh xcode

      - name: Smoke-test summary
        if: always()
        run: |
          {
            echo "## macOS PR library smoke test"
            echo
            echo "- Apothecary commit: \`${{ github.event.pull_request.head.sha }}\`"
            echo "- openFrameworks: \`master\`"
            echo "- Result: \`${{ job.status }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
