name: build-macos

on:
  push:
    branches: [bleeding, master]
    tags: ['**', '!latest', '!latest-modular', '!nightly', '!build-state', '!nightly-staging-*', '!nightly-previous-*']
    paths-ignore:
      - '**/README.md'
  pull_request:
    paths-ignore:
      - '**/README.md'
      
concurrency:
  group: ${{ github.workflow }}-${{ startsWith(github.ref, 'refs/tags/') && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: write
  actions: read

env:
  TARGET: "osx"
  NO_FORCE: 1
  GA_CI_SECRET: ${{ secrets.CI_SECRET }}
  USE_ARTIFACT: true
  DISABLE_WORKFLOW: "false"

jobs:  
  pre-check:
    runs-on: ubuntu-latest
    outputs:
      workflow_disabled: ${{ steps.plan.outputs.workflow_disabled }}
      build_needed: ${{ steps.plan.outputs.build_needed }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Plan selected formula and toolchain builds
        id: plan
        uses: actions/github-script@v9.0.0
        with:
          script: |
            await require(`${process.env.GITHUB_WORKSPACE}/scripts/release-build-plan.cjs`).plan({github, context, core, workflow: '.github/workflows/build-macos.yml', job: 'build-macos-platforms'});
      - uses: actions/upload-artifact@v7.0.0
        with:
          name: build-plan-${{ github.workflow }}
          path: .build-plans/*.json
          include-hidden-files: true
          if-no-files-found: ignore
  build-macos-platforms:
    if: needs.pre-check.outputs.build_needed == 'true'
    runs-on: macos-14
    needs: pre-check
    strategy:
      matrix: ${{ fromJSON(needs.pre-check.outputs.matrix) }}
    env:
      BUNDLE: ${{ matrix.bundle }}
      DEVELOPER_DIR: "/Applications/Xcode_16.2.app/Contents/Developer"
    steps:
      - name: Determine Release
        id: vars
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "RELEASE=${{ github.ref_name }}" >> $GITHUB_ENV
          elif [[ "${{ github.ref }}" == "refs/heads/master" ]]; then
            echo "RELEASE=nightly" >> $GITHUB_ENV
          elif [[ "${{ github.ref }}" == "refs/heads/bleeding" ]]; then
            echo "RELEASE=latest" >> $GITHUB_ENV
          else
            echo "RELEASE=latest" >> $GITHUB_ENV
          fi
      - uses: actions/checkout@v7.0.1
      - name: Scripts Calc Formula - ${{ env.TARGET }} Bundle ${{ matrix.bundle }}
        run: ./scripts/calculate_formulas.sh
      - name: Scripts Install
        run: |
          ./scripts/osx/install.sh
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
      - name: Verify Homebrew Bash
        run: |
          command -v bash
          bash --version
      - name: Restore compatible platform artifacts
        id: platform-artifacts
        continue-on-error: true
        if: env.USE_ARTIFACT == 'true'
        uses: ./.github/actions/platform-artifacts
        with:
          phase: restore
          variant: ${{ matrix.bundle }}
          archs: x86_64 arm64
      - name: List output directory1
        run: ls -lah out/
      - name: Build macOS x86_64
        working-directory: ${{ env.GITHUB_WORKSPACE }}
        run: scripts/build.sh
        env:
          BUNDLE: ${{ matrix.bundle }}
          ARCH: x86_64
      - name: Build macOS arm64
        working-directory: ${{ env.GITHUB_WORKSPACE }}
        run: scripts/build.sh
        env:
          BUNDLE: ${{ matrix.bundle }}
          ARCH: arm64
      - name: Publish platform artifact baseline
        continue-on-error: true
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/bleeding') && env.USE_ARTIFACT == 'true' && steps.platform-artifacts.outcome == 'success'
        uses: ./.github/actions/platform-artifacts
        with:
          phase: save
          variant: ${{ matrix.bundle }}
          archs: x86_64 arm64
      - name: List output directory
        run: ls -lah out/
      - name: Cleanup out of bundle
        working-directory: ${{ env.GITHUB_WORKSPACE }}
        run: scripts/artifact/artifact-clean.sh
        env:
          BUNDLE: ${{ matrix.bundle }}
      - name: List output directory2
        run: ls -lah out/

      # - name: Build Poco
      #   run: ./apothecary/apothecary -tosx -ax86_64 update poco

      - name: Package Binaries for Artifact
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/bleeding')
        working-directory: ${{ env.GITHUB_WORKSPACE }}
        run: scripts/artifact/artifact.sh
        env:
          BUNDLE: ${{ matrix.bundle }}
          GA_CI_SECRET: ${{ secrets.CI_SECRET }}
      - name: Upload binaries as Artifact
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/bleeding')
        uses: actions/upload-artifact@v7.0.0
        with:
          name: libs-${{ env.RELEASE }}-${{ env.TARGET }}-${{ matrix.bundle }}
          path: out/openFrameworksLibs_${{ env.RELEASE }}_${{ env.TARGET }}_${{ matrix.bundle }}.tar.bz2
          retention-days: 31

      - name: Remove .tar.bz2 files
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/bleeding' )
        run: |
          echo "Removing .tar.bz2 files from out/ directory..."
          rm -f out/*.tar.bz2
          rm -f xout/*.tar.bz2
          echo "Cleanup complete."

      - name: Merge our libraries into XC Framework 
        working-directory: ${{ env.GITHUB_WORKSPACE }}
        run: scripts/osx/xcframework_all.sh
        env:
          BUNDLE: ${{ matrix.bundle }}

      - name: Package Individual Modular Libraries (macOS)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/bleeding' || contains(github.ref, 'refs/tags/')) && matrix.bundle == 3
        working-directory: ${{ env.GITHUB_WORKSPACE }}
        run: |
          scripts/package-individual.sh
        env:
          GA_CI_SECRET: ${{ secrets.CI_SECRET }}

      - name: List output directory before modular upload
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/bleeding' || contains(github.ref, 'refs/tags/')) && matrix.bundle == 3
        run: ls -lah xout/

      # ── Clean before latest-modular upload (macOS) ─────────────────────────
      - name: Clean before latest-modular upload
        if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/bleeding') && matrix.bundle == 3
        run: |
          echo "🧹 Cleaning any existing openFrameworksLibs* files before latest-modular upload..."
          rm -f xout/openFrameworksLibs*.tar.bz2
          echo "Files remaining in xout/:"
          ls -lah xout/

      - name: Upload to GitHub Release (latest-modular)
        if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/bleeding') && matrix.bundle == 3
        uses: softprops/action-gh-release@v3.0.3
        with:
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          tag_name: "latest-modular"
          files: xout/*.tar.bz2

      - name: Remove .tar.bz2 files
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/bleeding' )
        run: |
          echo "Removing .tar.bz2 files from out/ directory..."
          rm -f out/*.tar.bz2
          rm -f xout/*.tar.bz2
          echo "Cleanup complete."

      - name: Package final
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/bleeding' || contains(github.ref, 'refs/tags/'))
        working-directory: ${{ env.GITHUB_WORKSPACE }}
        run: scripts/package.sh
        env:
          BUNDLE: ${{ matrix.bundle }}
      - name: Package PR smoke-test libraries
        if: github.event_name == 'pull_request'
        working-directory: ${{ env.GITHUB_WORKSPACE }}
        run: scripts/package.sh
        env:
          ALWAYS_BUILD: 1
          BUNDLE: ${{ matrix.bundle }}
      - name: Upload PR smoke-test libraries
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7.0.0
        with:
          name: pr-libraries-osx-${{ matrix.bundle }}
          path: xout/openFrameworksLibs_latest_osx_${{ matrix.bundle }}.tar.bz2
          if-no-files-found: error
          retention-days: 7
      - name: Update Release XCFramework
        if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/bleeding')
        uses: softprops/action-gh-release@v3.0.3
        with:
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          tag_name: ${{ env.RELEASE }}
          files: xout/openFrameworksLibs_${{ env.RELEASE }}_${{ env.TARGET }}_${{ matrix.bundle }}.tar.bz2


      - name: Download verified Linux build plan
        if: github.event_name == 'push' && (github.ref == 'refs/heads/bleeding' || github.ref == 'refs/heads/master')
        uses: actions/download-artifact@v8
        with:
          name: build-plan-${{ github.workflow }}
          path: ${{ runner.temp }}/build-plans
      - name: Record final release outputs
        if: github.event_name == 'push' && (github.ref == 'refs/heads/bleeding' || github.ref == 'refs/heads/master')
        uses: actions/github-script@v9.0.0
        env:
          BUILD_PLAN_MATRIX: ${{ toJSON(matrix) }}
        with:
          github-token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            await require(`${process.env.GITHUB_WORKSPACE}/scripts/release-build-plan.cjs`).record({github, context, core, workflow: '.github/workflows/build-macos.yml', job: 'build-macos-platforms', matrix: JSON.parse(process.env.BUILD_PLAN_MATRIX)});
  smoke-test-openframeworks:
    name: Smoke test PR libraries in openFrameworks
    # Temporarily disabled while openFrameworks is updated for OpenSSL 4.
    if: ${{ false }}
    needs: build-macos-platforms
    runs-on: macos-14
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
      OF_ROOT: ${{ github.workspace }}/openFrameworks
    steps:
      - name: Check out Apothecary test scripts
        uses: actions/checkout@v7.0.1
        with:
          path: apothecary-tests

      - name: Check out openFrameworks
        uses: actions/checkout@v7.0.1
        with:
          repository: openframeworks/openFrameworks
          ref: master
          submodules: recursive
          path: openFrameworks

      - name: Download PR library bundles
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: pr-libraries-osx-*
          path: pr-libraries
          merge-multiple: true

      - name: Deploy PR libraries into openFrameworks
        run: bash apothecary-tests/scripts/deploy-openframeworks-artifacts.sh "$OF_ROOT" "$GITHUB_WORKSPACE/pr-libraries" osx

      - name: Build openFrameworks macOS smoke test
        working-directory: openFrameworks
        env:
          TRAVIS_BUILD_DIR: ${{ github.workspace }}/openFrameworks
        run: scripts/ci/osx/build.sh xcode

      - name: Smoke-test summary
        if: always()
        run: |
          {
            echo "## macOS PR library smoke test"
            echo
            echo "- Apothecary commit: \`${{ github.event.pull_request.head.sha }}\`"
            echo "- openFrameworks: \`master\`"
            echo "- Result: \`${{ job.status }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
