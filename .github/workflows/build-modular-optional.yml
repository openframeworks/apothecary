name: build-modular-optional

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/build-modular-optional.yml'
      - 'apothecary/formulas/angle/**'
      - 'apothecary/formulas/metalangle/**'
      - 'apothecary/formulas/glon12.sh'
      - 'apothecary/formulas/dawn/**'
      - 'scripts/tests/test-angle-bootstrap.sh'
      - 'scripts/tests/test-angle-xros-runtime.sh'
      - 'scripts/tests/test-secure-compiler.sh'
      - 'scripts/tests/test-glon12-toolchain.sh'
      - 'scripts/tests/test-glon12-runtime.sh'
      - 'scripts/secure.sh'
      - 'scripts/modular-cache-key.sh'
      - 'scripts/cache-toolchain.sh'
      - 'scripts/build-modular-optional.sh'
      - 'scripts/calculate_formulas.sh'
      - 'scripts/tests/test-modular-cache.sh'
      - 'scripts/tests/test-apple-install-tools.sh'
      - 'scripts/apple-install-tools.sh'
  push:
    branches: [bleeding, master]
    paths-ignore: ['**/*.md']

concurrency:
  group: ${{ github.workflow }}-${{ startsWith(github.ref, 'refs/tags/') && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: write

env:
  # Bump for compiler/SDK setup or build-command changes not declared below.
  BUILD_PROFILE_ID: "1"

jobs:
  test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: bash scripts/tests/test-angle-bootstrap.sh
      - run: bash scripts/tests/test-secure-compiler.sh
      - run: bash scripts/tests/test-glon12-toolchain.sh
      - run: bash scripts/tests/test-glon12-runtime.sh
      - run: bash scripts/tests/test-modular-cache.sh
      - run: bash scripts/tests/test-apple-install-tools.sh

  apple:
    needs: test
    name: optional ${{ matrix.library }}-${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        target: [osx, ios, tvos, catos, xros]
        library: [angle, metalangle, dawn]
        exclude:
          - {target: catos, library: metalangle}
          - {target: xros, library: metalangle}
        include:
          - {target: osx, runner: macos-14, xcode: Xcode_16.2.app, archs: 'x86_64 arm64', install: osx}
          - {target: ios, runner: macos-14, xcode: Xcode_16.2.app, archs: 'arm64 x86_64 SIM_arm64', install: ios}
          - {target: tvos, runner: macos-14, xcode: Xcode_16.2.app, archs: 'arm64 SIM_arm64', install: tvos}
          - {target: catos, runner: macos-26, xcode: Xcode_26.6.app, archs: 'arm64 x86_64', install: catos}
          - {target: xros, runner: macos-26, xcode: Xcode_26.6.app, archs: 'arm64 SIM_arm64', install: xros}
    env:
      TARGET: ${{ matrix.target }}
      TYPE: ${{ matrix.target }}
      DEVELOPER_DIR: /Applications/${{ matrix.xcode }}/Contents/Developer
      OPTIONAL_ARCHS: ${{ matrix.archs }}
      PACKAGE_LIBS: ${{ matrix.library }}
      ALWAYS_BUILD: 1
      NO_FORCE: 1
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Verify ANGLE dynamic XCFramework staging
        if: matrix.library == 'angle'
        run: bash scripts/tests/test-angle-apple-stage.sh
      - name: Verify ANGLE visionOS compiler runtimes
        if: matrix.library == 'angle' && matrix.target == 'xros'
        run: bash scripts/tests/test-angle-xros-runtime.sh
      - name: Install
        run: ./scripts/${{ matrix.install }}/install.sh
      - name: Ensure Ninja is available for the cache fingerprint
        run: command -v ninja >/dev/null || brew install ninja
      - name: Compute exact modular cache key
        id: key
        run: bash scripts/modular-cache-key.sh "$PACKAGE_LIBS" >> "$GITHUB_OUTPUT"
      - name: Restore compiled modular outputs
        id: cache
        uses: actions/cache/restore@v6.1.0
        with:
          key: ${{ steps.key.outputs.key }}
          path: |
            out/${{ matrix.library }}
            xout/${{ matrix.library }}
      - name: Report modular cache result
        env:
          CACHE_KEY: ${{ steps.key.outputs.key }}
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        run: |
          printf '### Modular cache: %s / %s\n\nKey: `%s`\n\nExact hit: `%s`\n' "$TARGET" "$PACKAGE_LIBS" "$CACHE_KEY" "${CACHE_HIT:-false}" >> "$GITHUB_STEP_SUMMARY"
      - name: Build or reuse and package modular library
        env:
          MODULAR_CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        run: bash scripts/build-modular-optional.sh
      - name: Save compiled modular outputs
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          key: ${{ steps.key.outputs.key }}
          path: |
            out/${{ matrix.library }}
            xout/${{ matrix.library }}
      - name: Upload to latest-modular
        if: github.event_name == 'push' && github.repository == 'openframeworks/apothecary'
        uses: danoli3/action-gh-release@ec40b04e78c39008f73c4ca3fdf9b51df604c4ed # temporary patch: softprops/action-gh-release#852
        with:
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          tag_name: latest-modular
          fail_on_unmatched_files: true
          files: xout/oF_${{ matrix.library }}_*.tar.bz2

  vs:
    needs: test
    name: optional ${{ matrix.library }}-vs-64
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        library: [angle, dawn]
    defaults:
      run:
        shell: msys2 {0}
    env:
      TARGET: vs
      TYPE: vs
      ARCH: 64
      VS_VER: 17
      PACKAGE_LIBS: ${{ matrix.library }}
      ALWAYS_BUILD: 1
      NO_FORCE: 1
    steps:
      - uses: msys2/setup-msys2@v2.33.0
        with:
          update: true
          install: >-
            base-devel unzip dos2unix gperf git python3
            mingw-w64-x86_64-binutils mingw-w64-x86_64-clang
            mingw-w64-x86_64-gcc mingw-w64-x86_64-gcc-libs
            mingw-w64-x86_64-cmake mingw-w64-x86_64-make meson
            mingw-w64-x86_64-ninja
      - uses: actions/checkout@v7.0.1
      - uses: microsoft/setup-msbuild@v3
      - name: Scripts Install
        run: ./scripts/vs/install.sh
      - name: Compute exact modular cache key
        id: key
        run: bash scripts/modular-cache-key.sh "$PACKAGE_LIBS" >> "$GITHUB_OUTPUT"
      - name: Restore compiled modular outputs
        id: cache
        uses: actions/cache/restore@v6.1.0
        with:
          key: ${{ steps.key.outputs.key }}
          path: out/${{ matrix.library }}
      - name: Report modular cache result
        env:
          CACHE_KEY: ${{ steps.key.outputs.key }}
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        run: |
          printf '### Modular cache: %s / %s\n\nKey: `%s`\n\nExact hit: `%s`\n' "$TARGET" "$PACKAGE_LIBS" "$CACHE_KEY" "${CACHE_HIT:-false}" >> "$GITHUB_STEP_SUMMARY"
      - name: Build or reuse and package modular library
        env:
          MODULAR_CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        run: bash scripts/build-modular-optional.sh
      - name: Save compiled modular outputs
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          key: ${{ steps.key.outputs.key }}
          path: out/${{ matrix.library }}
      - name: Upload to latest-modular
        if: github.event_name == 'push' && github.repository == 'openframeworks/apothecary'
        uses: danoli3/action-gh-release@ec40b04e78c39008f73c4ca3fdf9b51df604c4ed # temporary patch: softprops/action-gh-release#852
        with:
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          tag_name: latest-modular
          fail_on_unmatched_files: true
          files: out/oF_${{ matrix.library }}_*.zip

  glon12:
    needs: test
    name: optional glon12-vs-${{ matrix.arch }}
    runs-on: windows-2022
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        arch: ['64', arm64, arm64ec]
    defaults:
      run:
        shell: msys2 {0}
    env:
      TARGET: vs
      TYPE: vs
      ARCH: ${{ matrix.arch }}
      VS_VER: 17
      PACKAGE_LIBS: glon12
      ALWAYS_BUILD: 1
      NO_FORCE: 1
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        id: python
        with:
          python-version: '3.12'
      - uses: msys2/setup-msys2@v2.33.0
        with:
          msystem: MSYS
          path-type: inherit
          update: true
          cache: true
          install: base-devel git curl unzip dos2unix
      - name: Install native Windows Meson and Ninja
        shell: pwsh
        run: python -m pip install --disable-pip-version-check meson ninja packaging mako pyyaml setuptools
      - name: Fingerprint native build tools and SDK
        env:
          WINDOWS_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          python_dir=$(dirname "$(cygpath -u "$WINDOWS_PYTHON")")
          printf '%s\n' "$(cygpath -w "$python_dir")" "$(cygpath -w "$python_dir/Scripts")" >> "$GITHUB_PATH"
          export PATH="$python_dir:$python_dir/Scripts:$PATH"
          sdk_root="${GLON12_WINDOWS_SDK_ROOT:-${WindowsSdkDir:-${WINDOWSSDKDIR:-/c/Program Files (x86)/Windows Kits/10}}}"
          sdk_root=$(cygpath -u "$sdk_root")
          context="$(cygpath -u "$RUNNER_TEMP")/glon12-toolchain.txt"
          {
            python --version
            meson --version
            ninja --version
            '/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe' -latest -property installationVersion
            ls -1 '/c/Program Files/Microsoft Visual Studio/2022/Enterprise/VC/Tools/MSVC'
            ls -1 "$sdk_root/Include"
            # Cached packages include the SDK validator, whose bytes can
            # change independently of the installed SDK directory names.
            while IFS= read -r validator; do
              sha256sum "$validator"
            done < <(find "$sdk_root/bin" -type f -iname dxil.dll | LC_ALL=C sort)
          } > "$context"
          echo "PLATFORM_ARTIFACT_CONTEXT=$context" >> "$GITHUB_ENV"
      - name: Compute exact modular cache key
        id: key
        run: bash scripts/modular-cache-key.sh "$PACKAGE_LIBS" >> "$GITHUB_OUTPUT"
      - name: Restore compiled modular outputs
        id: cache
        uses: actions/cache/restore@v6.1.0
        with:
          key: ${{ steps.key.outputs.key }}
          path: out/glon12
      - name: Report modular cache result
        env:
          CACHE_KEY: ${{ steps.key.outputs.key }}
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        run: |
          printf '### Modular cache: GLon12 / %s\n\nKey: `%s`\n\nExact hit: `%s`\n' "$ARCH" "$CACHE_KEY" "${CACHE_HIT:-false}" >> "$GITHUB_STEP_SUMMARY"
      - name: Build or reuse and package GLon12
        env:
          MODULAR_CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        run: bash scripts/build-modular-optional.sh
      - name: Verify packaged GLon12 DLLs
        run: |
          package="out/oF_glon12_vs_${ARCH}.zip"
          test -f "$package"
          listing="$(cygpath -u "$RUNNER_TEMP")/glon12-files.txt"
          unzip -Z1 "$package" > "$listing"
          grep -iE '/opengl32[.]dll$' "$listing"
          grep -iE '/libgallium_wgl[.]dll$' "$listing"
          grep -iE '/dxil[.]dll$' "$listing"
      - name: Save compiled modular outputs
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          key: ${{ steps.key.outputs.key }}
          path: out/glon12
      - name: Upload validation package
        uses: actions/upload-artifact@v7.0.2
        with:
          name: glon12-vs-${{ matrix.arch }}
          path: out/oF_glon12_vs_${{ matrix.arch }}.zip
          if-no-files-found: error
      - name: Upload to latest-modular
        if: github.event_name == 'push' && github.repository == 'openframeworks/apothecary'
        uses: danoli3/action-gh-release@ec40b04e78c39008f73c4ca3fdf9b51df604c4ed # temporary patch: softprops/action-gh-release#852
        with:
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          tag_name: latest-modular
          overwrite_files: true
          fail_on_unmatched_files: true
          files: out/oF_glon12_vs_${{ matrix.arch }}.zip
