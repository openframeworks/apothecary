name: build-vs2022-64

on:
  workflow_dispatch:
  push:
    branches: [bleeding, master]
    tags: ['**', '!latest', '!latest-modular', '!nightly', '!build-state', '!sha256', '!nightly-staging-*', '!nightly-previous-*']
    paths-ignore:
    - '**/*.md'
  pull_request:
    paths-ignore:
    - '**/*.md'

concurrency:
  group: ${{ github.workflow }}-${{ startsWith(github.ref, 'refs/tags/') && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  actions: read
  contents: write

env:
  # Bump for compiler/SDK setup or build-command changes not declared below.
  BUILD_PROFILE_ID: "1"
  TARGET: "vs"
  ARCH: 64
  NO_FORCE: 1
  VS_VER: 17
  GA_CI_SECRET: ${{ secrets.CI_SECRET }}
  USE_ARTIFACT: true
  DISABLE_WORKFLOW: "false"

jobs:  
  pre-check:
    runs-on: ubuntu-latest
    outputs:
      workflow_disabled: ${{ steps.plan.outputs.workflow_disabled }}
      build_needed: ${{ steps.plan.outputs.build_needed }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Plan selected formula and toolchain builds
        id: plan
        uses: actions/github-script@v9.0.0
        with:
          script: |
            await require(`${process.env.GITHUB_WORKSPACE}/scripts/release-build-plan.cjs`).plan({github, context, core, workflow: '.github/workflows/build-vs2022-x64.yml', job: 'build-vs2022-64'});
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: build-plan-${{ github.workflow }}
          path: .build-plans/*.pkl
          include-hidden-files: true
          if-no-files-found: ignore
  build-vs2022-64:
    if: needs.pre-check.outputs.build_needed == 'true'
    needs: pre-check
    runs-on: windows-2022
    strategy:
      matrix: ${{ fromJSON(needs.pre-check.outputs.matrix) }}
    defaults:
      run:
        shell: msys2 {0}
    steps:
    - name: Check if Workflow is disabled
      shell: bash
      run: |
        if [ "${{ env.DISABLE_WORKFLOW }}" == "true" ]; then
          echo "Workflow is disabled. Exiting."
          exit 78
        fi
    - name: Setup msys2
      uses: msys2/setup-msys2@v2.33.0
      with:
        update: true
        install: >-
          base-devel
          unzip
          dos2unix
          gperf
          git
          mingw-w64-x86_64-python
          mingw-w64-x86_64-binutils
          mingw-w64-x86_64-clang
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-gcc-libs
          mingw-w64-x86_64-cmake
          mingw-w64-x86_64-gdb
          mingw-w64-x86_64-make
          mingw-w64-x86_64-meson
          mingw-w64-x86_64-ninja
    - name: Clone repository
      uses: actions/checkout@v7.0.1
    - name: Restore Apothecary build cache
      uses: actions/cache@v6.1.0
      with:
        path: apothecary/build
        key: apothecary-vs${{ env.VS_VER }}-${{ env.ARCH }}-bundle-${{ matrix.bundle }}-${{ hashFiles('apothecary/formulas/**', 'apothecary/apothecary', 'scripts/build.sh', 'scripts/calculate_formulas.sh', 'scripts/vs/**') }}
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v3
    - name: Determine Release
      id: vars
      shell: bash
      run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "RELEASE=${{ github.ref_name }}" >> $GITHUB_ENV
          elif [[ "${{ github.ref }}" == "refs/heads/master" ]]; then
            echo "RELEASE=nightly" >> $GITHUB_ENV
          elif [[ "${{ github.ref }}" == "refs/heads/bleeding" ]]; then
            echo "RELEASE=latest" >> $GITHUB_ENV
          else
            echo "RELEASE=latest" >> $GITHUB_ENV
          fi
    - name: Scripts Install
      run: ./scripts/vs/install.sh
    - name: Restore compatible platform artifacts
      id: platform-artifacts
      env:
        BUNDLE: ${{ matrix.bundle }}
      continue-on-error: true
      if: env.USE_ARTIFACT == 'true'
      uses: ./.github/actions/platform-artifacts
      with:
        phase: restore
        variant: ${{ env.ARCH }}-${{ matrix.bundle }}
        archs: ${{ env.ARCH }}
        shell: msys2 {0}
    - name: List output directory1
      if: env.USE_ARTIFACT == 'true'
      run: ls -lah out/
    - name: Build64
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: scripts/build.sh
      env:
        BUNDLE: ${{ matrix.bundle }}
    - name: Package Poco modular library
      if: matrix.bundle == 2
      env:
        PACKAGE_LIBS: poco
        ALWAYS_BUILD: 1
      run: |
        bash scripts/package-individual.sh
        python3 scripts/tests/check-poco-windows-package.py "out/oF_poco_vs_${ARCH}.zip" out/poco
    - name: Upload Poco review package
      if: matrix.bundle == 2
      uses: actions/upload-artifact@v7.0.2
      with:
        name: poco-vs-${{ env.ARCH }}
        path: out/oF_poco_vs_${{ env.ARCH }}.zip
        if-no-files-found: error
    - name: Publish Poco modular library
      if: matrix.bundle == 2 && github.repository == 'openframeworks/apothecary' && github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/bleeding')
      uses: danoli3/action-gh-release@ec40b04e78c39008f73c4ca3fdf9b51df604c4ed # temporary patch: softprops/action-gh-release#852
      with:
        token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
        tag_name: latest-modular
        fail_on_unmatched_files: true
        files: out/oF_poco_vs_${{ env.ARCH }}.zip
    - name: Publish platform artifact baseline
      env:
        BUNDLE: ${{ matrix.bundle }}
      continue-on-error: true
      if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/bleeding') && env.USE_ARTIFACT == 'true' && steps.platform-artifacts.outcome == 'success'
      uses: ./.github/actions/platform-artifacts
      with:
        phase: save
        variant: ${{ env.ARCH }}-${{ matrix.bundle }}
        archs: ${{ env.ARCH }}
        shell: msys2 {0}
    - name: Package
      if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/bleeding' || contains(github.ref, 'refs/tags/'))
      working-directory: ${{ env.GITHUB_WORKSPACE }}
      run: scripts/package.sh
      env:
        BUNDLE: ${{ matrix.bundle }}
    - name: Upload binaries as Artifact
      if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/bleeding' )
      uses: actions/upload-artifact@v7.0.2
      env:
        release: ${{ env.RELEASE }}
      with:
        name: libs-${{ env.RELEASE }}-${{ env.TARGET }}-${{ env.ARCH }}-${{ matrix.bundle }}
        path: out/openFrameworksLibs_${{ env.RELEASE }}_${{ env.TARGET }}_${{ env.ARCH }}_${{ matrix.bundle }}.zip
        retention-days: 31

    - name: Update Release x64
      if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/bleeding')
      uses: danoli3/action-gh-release@ec40b04e78c39008f73c4ca3fdf9b51df604c4ed # temporary patch: softprops/action-gh-release#852
      with:
        token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
        tag_name: ${{ env.RELEASE }}
        draft: false
        files: out/openFrameworksLibs_${{ env.RELEASE }}_${{ env.TARGET }}_${{ env.ARCH }}_${{ matrix.bundle }}.zip

    - name: Download verified Linux build plan
      if: github.event_name == 'push' && (github.ref == 'refs/heads/bleeding' || github.ref == 'refs/heads/master')
      uses: actions/download-artifact@v8.0.2
      with:
        name: build-plan-${{ github.workflow }}
        path: ${{ runner.temp }}/build-plans
    - name: Record final release outputs
      if: github.event_name == 'push' && (github.ref == 'refs/heads/bleeding' || github.ref == 'refs/heads/master')
      uses: actions/github-script@v9.0.0
      env:
        BUILD_PLAN_MATRIX: ${{ toJSON(matrix) }}
      with:
        github-token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
        script: |
          await require(`${process.env.GITHUB_WORKSPACE}/scripts/release-build-plan.cjs`).record({github, context, core, workflow: '.github/workflows/build-vs2022-x64.yml', job: 'build-vs2022-64', matrix: JSON.parse(process.env.BUILD_PLAN_MATRIX)});
