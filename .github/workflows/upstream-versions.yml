name: Upstream version check

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/check-upstream-versions.sh'
      - 'scripts/upstream-versions.json'
      - 'scripts/upstream-versions.jq'
      - 'scripts/tests/test-upstream-versions.sh'
      - '.github/workflows/upstream-versions.yml'
  push:
    paths:
      - 'scripts/check-upstream-versions.sh'
      - 'scripts/upstream-versions.json'
      - 'scripts/upstream-versions.jq'
      - 'scripts/tests/test-upstream-versions.sh'
      - '.github/workflows/upstream-versions.yml'

permissions:
  contents: read

concurrency:
  group: upstream-versions-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: bash scripts/tests/test-upstream-versions.sh

  check:
    needs: test
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.repository == 'openframeworks/apothecary')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: bleeding
      - name: Compare formula versions and maintain tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash scripts/check-upstream-versions.sh --file-issue
