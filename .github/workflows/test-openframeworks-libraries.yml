name: Test libraries in openFrameworks

on:
  workflow_call:
    inputs:
      library_ref:
        type: string
        required: true
      openframeworks_ref:
        type: string
        required: true
      platform:
        type: string
        required: true
      snapshot_manifest_artifact:
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      library_ref:
        description: Library line or release to test
        required: true
        default: bleeding
        type: choice
        options:
          - bleeding
          - master
          - latest
          - latest-modular
      openframeworks_ref:
        description: openFrameworks branch, tag, or SHA
        required: true
        default: master
        type: string
      platform:
        description: Integration target
        required: true
        default: linux
        type: choice
        options:
          - linux
          - macos
          - ios
          - tvos
          - android
          - emscripten
          - windows

permissions:
  contents: read
  actions: read

concurrency:
  group: of-library-integration-${{ inputs.library_ref }}-${{ inputs.openframeworks_ref }}-${{ inputs.platform }}
  cancel-in-progress: false

jobs:
  integration:
    name: ${{ inputs.platform }} / ${{ inputs.library_ref }} / oF ${{ inputs.openframeworks_ref }}
    runs-on: ${{ (inputs.platform == 'macos' || inputs.platform == 'ios' || inputs.platform == 'tvos') && 'macos-15' || inputs.platform == 'windows' && 'windows-2022' || 'ubuntu-24.04' }}
    env:
      OF_ROOT: ${{ github.workspace }}/openFrameworks
      GH_TOKEN: ${{ github.token }}
      APOTHECARY_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Check out Apothecary test scripts
        uses: actions/checkout@v7.0.1
        with:
          path: apothecary-tests

      - name: Check out openFrameworks
        uses: actions/checkout@v7.0.1
        with:
          repository: openframeworks/openFrameworks
          ref: ${{ inputs.openframeworks_ref }}
          submodules: recursive
          path: openFrameworks

      - name: Set up MSYS2 download tools
        if: inputs.platform == 'windows'
        uses: msys2/setup-msys2@v2
        with:
          update: true
          install: git unzip

      - name: Install Linux dependencies
        if: inputs.platform == 'linux'
        run: sudo openFrameworks/scripts/linux/ubuntu/install_dependencies.sh -y

      - name: Install Windows build dependencies
        if: inputs.platform == 'windows'
        shell: msys2 {0}
        working-directory: openFrameworks
        run: scripts/ci/vs/install.sh

      - name: Set up Node for frozen candidate verification
        if: inputs.snapshot_manifest_artifact != ''
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Download frozen candidate plan
        if: inputs.snapshot_manifest_artifact != ''
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.snapshot_manifest_artifact }}
          path: ${{ runner.temp }}/nightly-plan

      # CI setup may download its normal libraries. Install the frozen bytes
      # after setup so those downloads cannot substitute for the candidate.
      - name: Install selected libraries
        shell: bash
        env:
          LIBRARY_REF: ${{ inputs.library_ref }}
          INTEGRATION_PLATFORM: ${{ inputs.platform }}
          SNAPSHOT_MANIFEST: ${{ inputs.snapshot_manifest_artifact != '' && format('{0}/nightly-plan/plan.json', runner.temp) || '' }}
        run: bash apothecary-tests/scripts/test-openframeworks-libraries.sh "$OF_ROOT" "$LIBRARY_REF" "$INTEGRATION_PLATFORM" "$SNAPSHOT_MANIFEST"

      - name: Build Linux core, emptyExample, and allAddonsExample
        if: inputs.platform == 'linux'
        working-directory: openFrameworks
        env:
          TRAVIS_BUILD_DIR: ${{ github.workspace }}/openFrameworks
        run: scripts/ci/linux/64/build.sh

      - name: Run Linux smoke tests
        if: inputs.platform == 'linux'
        working-directory: openFrameworks
        env:
          TRAVIS_BUILD_DIR: ${{ github.workspace }}/openFrameworks
        run: scripts/ci/linux/64/run_tests.sh

      - name: Build macOS core and examples
        if: inputs.platform == 'macos'
        working-directory: openFrameworks
        env:
          DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
          SDKROOT: /Applications/Xcode.app/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk
        run: scripts/ci/osx/build.sh xcode

      - name: Build iOS
        if: inputs.platform == 'ios'
        working-directory: openFrameworks
        env:
          DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
        run: env GITHUB_WORKSPACE="$OF_ROOT" scripts/ci/ios/build.sh

      - name: Build tvOS
        if: inputs.platform == 'tvos'
        working-directory: openFrameworks
        env:
          DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
        run: env GITHUB_WORKSPACE="$OF_ROOT" scripts/ci/tvos/build.sh

      - name: Set up Java
        if: inputs.platform == 'android'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Build Android core
        if: inputs.platform == 'android'
        working-directory: openFrameworks/libs/openFrameworksCompiled/project/android
        env:
          NDK: '29.0.14206865'
          ANDROID_API: '25'
          ARCH: arm64-v8a
          NUM_CORES: '2'
        run: |
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/$NDK"
          sdkmanager "ndk;$NDK" 'cmake;3.22.1' 'platforms;android-34' 'build-tools;37.0.0'
          gradle wrapper
          chmod +x gradlew
          ./gradlew assembleDebug
          ./cmake.sh

      - name: Build Emscripten core and examples
        if: inputs.platform == 'emscripten'
        working-directory: openFrameworks
        run: |
          docker run --rm -v "$PWD:/src" -w /src emscripten/emsdk:6.0.11 scripts/ci/emscripten/build.sh

      - name: Set up MSBuild
        if: inputs.platform == 'windows'
        uses: microsoft/setup-msbuild@v3

      - name: Build Windows emptyExample and allAddonsExample
        if: inputs.platform == 'windows'
        working-directory: openFrameworks
        shell: pwsh
        run: |
          msbuild examples/templates/emptyExample/emptyExample.vcxproj /p:Configuration=Debug /p:Platform=x64 /p:PlatformToolset=v143
          msbuild examples/templates/allAddonsExample/allAddonsExample.vcxproj /p:Configuration=Debug /p:Platform=x64 /p:PlatformToolset=v143

      - name: Preserve candidate provenance
        if: always() && inputs.snapshot_manifest_artifact != ''
        uses: actions/upload-artifact@v7.0.0
        with:
          name: nightly-candidate-${{ inputs.platform }}
          path: openFrameworks/.nightly-candidate-*.json
          include-hidden-files: true
          if-no-files-found: warn

      - name: Integration summary
        if: always()
        shell: bash
        run: |
          {
            echo "## openFrameworks library integration"
            echo
            echo "- Libraries: \`${{ inputs.library_ref }}\`"
            echo "- openFrameworks: \`${{ inputs.openframeworks_ref }}\`"
            echo "- Platform: \`${{ inputs.platform }}\`"
            echo "- Result: \`${{ job.status }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
