name: Test libraries in openFrameworks

on:
  workflow_call:
    inputs:
      library_ref:
        type: string
        required: true
      openframeworks_ref:
        type: string
        required: true
      platform:
        type: string
        required: true
      snapshot_manifest_artifact:
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      library_ref:
        description: auto uses this workflow's tag (v12.2.0) or bleeding. Or type latest, latest-modular, master, or a release tag.
        required: true
        default: auto
        type: string
      openframeworks_ref:
        description: openFrameworks branch, tag, or SHA
        required: true
        default: master
        type: string
      platform:
        description: One integration target, or all
        required: true
        default: linux
        type: choice
        options:
          - linux
          - macos
          - ios
          - tvos
          - android
          - emscripten
          - windows
          - all

permissions:
  contents: read
  actions: read

concurrency:
  group: of-library-integration-${{ inputs.library_ref }}-${{ inputs.openframeworks_ref }}-${{ inputs.platform }}
  cancel-in-progress: false

jobs:
  plan:
    name: Resolve targets
    runs-on: ubuntu-24.04
    outputs:
      library_ref: ${{ steps.resolve.outputs.library_ref }}
      platforms: ${{ steps.resolve.outputs.platforms }}
    steps:
      - uses: actions/checkout@v7.0.1
      - id: resolve
        env:
          LIBRARY_REF: ${{ inputs.library_ref }}
          WORKFLOW_REF_TYPE: ${{ github.ref_type }}
          WORKFLOW_REF_NAME: ${{ github.ref_name }}
          PLATFORM: ${{ inputs.platform }}
        run: bash scripts/resolve-of-library-integration.sh

  integration:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.plan.outputs.platforms) }}
    name: ${{ matrix.platform }} / ${{ needs.plan.outputs.library_ref }} / oF ${{ inputs.openframeworks_ref }}
    runs-on: ${{ (matrix.platform == 'macos' || matrix.platform == 'ios' || matrix.platform == 'tvos') && 'macos-15' || matrix.platform == 'windows' && 'windows-2022' || 'ubuntu-24.04' }}
    timeout-minutes: 180
    env:
      OF_ROOT: ${{ github.workspace }}/openFrameworks
      GH_TOKEN: ${{ github.token }}
      APOTHECARY_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Check out Apothecary test scripts
        uses: actions/checkout@v7.0.1
        with:
          path: apothecary-tests

      - name: Check out openFrameworks
        uses: actions/checkout@v7.0.1
        with:
          repository: openframeworks/openFrameworks
          ref: ${{ inputs.openframeworks_ref }}
          submodules: recursive
          path: openFrameworks

      - name: Set up MSYS2 download tools
        if: matrix.platform == 'windows'
        uses: msys2/setup-msys2@v2.33.0
        with:
          release: false
          update: true
          install: git unzip

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: sudo openFrameworks/scripts/linux/ubuntu/install_dependencies.sh -y

      - name: Install Windows build dependencies
        if: matrix.platform == 'windows'
        shell: msys2 {0}
        working-directory: openFrameworks
        run: scripts/ci/vs/install.sh

      - name: Set up Node for frozen candidate verification
        if: inputs.snapshot_manifest_artifact != ''
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Download frozen candidate plan
        if: inputs.snapshot_manifest_artifact != ''
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.snapshot_manifest_artifact }}
          path: ${{ runner.temp }}/nightly-plan

      # CI setup may download its normal libraries. Install the frozen bytes
      # after setup so those downloads cannot substitute for the candidate.
      - name: Install selected libraries
        shell: bash
        env:
          LIBRARY_REF: ${{ needs.plan.outputs.library_ref }}
          INTEGRATION_PLATFORM: ${{ matrix.platform }}
          SNAPSHOT_MANIFEST: ${{ inputs.snapshot_manifest_artifact != '' && format('{0}/nightly-plan/plan.json', runner.temp) || '' }}
        run: bash apothecary-tests/scripts/test-openframeworks-libraries.sh "$OF_ROOT" "$LIBRARY_REF" "$INTEGRATION_PLATFORM" "$SNAPSHOT_MANIFEST"

      - name: Build Linux core, emptyExample, and allAddonsExample
        if: matrix.platform == 'linux'
        working-directory: openFrameworks
        env:
          TRAVIS_BUILD_DIR: ${{ github.workspace }}/openFrameworks
        run: scripts/ci/linux/64/build.sh

      - name: Run Linux smoke tests
        if: matrix.platform == 'linux'
        working-directory: openFrameworks
        env:
          TRAVIS_BUILD_DIR: ${{ github.workspace }}/openFrameworks
        run: scripts/ci/linux/64/run_tests.sh

      - name: Build macOS core and examples
        if: matrix.platform == 'macos'
        working-directory: openFrameworks
        env:
          DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
          SDKROOT: /Applications/Xcode.app/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk
        run: scripts/ci/osx/build.sh xcode

      - name: Build iOS
        if: matrix.platform == 'ios'
        working-directory: openFrameworks
        env:
          DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
        run: env GITHUB_WORKSPACE="$OF_ROOT" scripts/ci/ios/build.sh

      - name: Build tvOS
        if: matrix.platform == 'tvos'
        working-directory: openFrameworks
        env:
          DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
        run: env GITHUB_WORKSPACE="$OF_ROOT" scripts/ci/tvos/build.sh

      - name: Set up Java
        if: matrix.platform == 'android'
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Build Android core
        if: matrix.platform == 'android'
        working-directory: openFrameworks/libs/openFrameworksCompiled/project/android
        env:
          NDK: '29.0.14206865'
          ANDROID_API: '25'
          ARCH: arm64-v8a
          NUM_CORES: '2'
        run: |
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/$NDK"
          sdkmanager "ndk;$NDK" 'cmake;3.22.1' 'platforms;android-34' 'build-tools;37.0.0'
          gradle wrapper
          chmod +x gradlew
          ./gradlew assembleDebug
          ./cmake.sh

      - name: Build Emscripten core and examples
        if: matrix.platform == 'emscripten'
        working-directory: openFrameworks
        run: |
          docker run --rm -v "$PWD:/src" -w /src emscripten/emsdk:7.0.1 scripts/ci/emscripten/build.sh

      - name: Set up MSBuild
        if: matrix.platform == 'windows'
        uses: microsoft/setup-msbuild@v3

      - name: Build Windows emptyExample and allAddonsExample
        if: matrix.platform == 'windows'
        working-directory: openFrameworks
        shell: pwsh
        run: |
          msbuild examples/templates/emptyExample/emptyExample.vcxproj /p:Configuration=Debug /p:Platform=x64 /p:PlatformToolset=v143
          msbuild examples/templates/allAddonsExample/allAddonsExample.vcxproj /p:Configuration=Debug /p:Platform=x64 /p:PlatformToolset=v143

      - name: Preserve candidate provenance
        if: always() && inputs.snapshot_manifest_artifact != ''
        uses: actions/upload-artifact@v7.0.0
        with:
          name: nightly-candidate-${{ matrix.platform }}
          path: openFrameworks/.nightly-candidate-*.json
          include-hidden-files: true
          if-no-files-found: warn

      - name: Integration summary
        if: always()
        shell: bash
        run: |
          {
            echo "## openFrameworks library integration"
            echo
            echo "- Libraries: \`${{ needs.plan.outputs.library_ref }}\`"
            echo "- openFrameworks: \`${{ inputs.openframeworks_ref }}\`"
            echo "- Platform: \`${{ matrix.platform }}\`"
            echo "- Result: \`${{ job.status }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
