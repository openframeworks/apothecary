name: build-linux-modular

on:
  workflow_dispatch:
  push:
    branches: [bleeding, master]
    paths-ignore: ['**/*.md']
  pull_request:
    paths-ignore: ['**/*.md']

concurrency:
  group: ${{ github.workflow }}-${{ startsWith(github.ref, 'refs/tags/') && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: write
  actions: read

jobs:
  pre-check:
    runs-on: ubuntu-latest
    outputs:
      workflow_disabled: ${{ steps.plan.outputs.workflow_disabled }}
      build_needed: ${{ steps.plan.outputs.build_needed }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Plan selected formula and toolchain builds
        id: plan
        uses: actions/github-script@v9.0.0
        with:
          script: |
            await require(`${process.env.GITHUB_WORKSPACE}/scripts/release-build-plan.cjs`).plan({github, context, core, workflow: '.github/workflows/build-linux-modular.yml', job: 'build'});
      - uses: actions/upload-artifact@v7.0.0
        with:
          name: build-plan-${{ github.workflow }}
          path: .build-plans/*.json
          include-hidden-files: true
          if-no-files-found: ignore
  build:
    needs: pre-check
    if: needs.pre-check.outputs.build_needed == 'true'
    name: Linux modular - ${{ matrix.arch }} - GCC10
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.pre-check.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    container: ubuntu:20.04
    env:
      TARGET: linux
      TYPE: linux
      ARCH: ${{ matrix.arch }}
      GCC: gcc10
      GCC_VERSION: '10'
      CC: gcc-10
      CXX: g++-10
      CFLAGS: -O2 -fPIC ${{ matrix.arch_flags }}
      CXXFLAGS: -O2 -fPIC -D_GLIBCXX_USE_CXX11_ABI=1 ${{ matrix.arch_flags }}
      NO_FORCE: 1
      # dawn: deferred — git fetch of the pinned SHA fails in ~9s on this runner
      FORMULAS_OVERRIDE: ${{ join(matrix.libraries, ' ') }}
      PACKAGE_LIBS: ${{ join(matrix.libraries, ' ') }}
    steps:
      - name: Restore APT package cache
        uses: actions/cache@v5
        with:
          path: /github/home/.cache/apt/archives
          key: apt-focal-${{ matrix.arch }}-gcc10-v1

      - name: Install build tools and GCC 10
        shell: bash
        env:
          APT_ARCHIVES: /github/home/.cache/apt/archives
        run: |
          set -euo pipefail

          retry() {
            local attempt=1
            local max_attempts=3
            until "$@"; do
              if (( attempt >= max_attempts )); then
                echo "Command failed after ${attempt} attempts: $*" >&2
                return 1
              fi
              echo "Attempt ${attempt} failed; retrying in $((attempt * 5)) seconds: $*" >&2
              sleep $((attempt * 5))
              attempt=$((attempt + 1))
            done
          }

          install -d -m 755 "$APT_ARCHIVES/partial"
          retry apt-get update
          retry env DEBIAN_FRONTEND=noninteractive apt-get \
            -o "Dir::Cache::archives=$APT_ARCHIVES" \
            -o Acquire::Retries=5 \
            install -y ca-certificates git sudo gcc-10 g++-10 gfortran-10 binutils file curl unzip bzip2 autoconf automake build-essential ccache coreutils dos2unix flex gperf libtool make ninja-build pkg-config python3 python3-pip xz-utils freeglut3-dev libasound2-dev libc6-dev libegl1-mesa-dev libfftw3-dev libgl1-mesa-dev libglu1-mesa-dev libjack-dev libfontconfig1-dev libgtk-3-dev libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libpulse-dev libwayland-dev libx11-dev libxcursor-dev libxext-dev libxi-dev libxinerama-dev libxkbcommon-dev libxrandr-dev oss4-dev xorg-dev
          python3 -m pip install --no-cache-dir cmake==3.31.6 meson==1.5.2 packaging mako pyyaml
          cmake --version
          gcc-10 --version
          test "$(gcc-10 -dumpversion | cut -d. -f1)" = 10
      - uses: actions/checkout@v7.0.1
      - name: Trust checked-out workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Keep reusable outputs for every modular library
        run: |
          libraries=$(node -e "process.stdout.write(require('./scripts/build-matrices.json')['.github/workflows/build-linux-modular.yml'].build.library.join(' '))")
          echo "PLATFORM_CACHE_FORMULAS_OVERRIDE=$libraries" >> "$GITHUB_ENV"

      - name: Restore compatible platform artifacts
        id: platform-artifacts
        continue-on-error: true
        uses: ./.github/actions/platform-artifacts
        with:
          phase: restore
          variant: ${{ matrix.arch }}
          archs: ${{ matrix.arch }}

      - name: Build selected libraries on this runner
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          for library in $FORMULAS_OVERRIDE; do
            echo "::group::Build $library ($ARCH / GCC10)"
            if ! FORMULAS_OVERRIDE="$library" bash scripts/build.sh; then
              echo "::error::Failed to build $library for $ARCH"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit "$failed"

      - name: Publish platform artifact baseline
        if: github.event_name == 'push' && steps.platform-artifacts.outcome == 'success'
        continue-on-error: true
        uses: ./.github/actions/platform-artifacts
        with:
          phase: save
          variant: ${{ matrix.arch }}
          archs: ${{ matrix.arch }}

      - name: Package modular libraries
        if: github.event_name == 'push'
        env:
          ALWAYS_BUILD: 1
        run: scripts/package-individual.sh

      - name: Upload modular library asset
        if: github.repository == 'openframeworks/apothecary' && github.event_name == 'push'
        uses: actions/github-script@v9.0.0
        env:
          LIBRARY_NAMES: ${{ join(matrix.libraries, ' ') }}
        with:
          github-token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('node:fs');
            const release = (await github.rest.repos.getReleaseByTag({...context.repo, tag: 'latest-modular'})).data;
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {...context.repo, release_id: release.id, per_page: 100});
            for (const library of process.env.LIBRARY_NAMES.split(/\s+/).filter(Boolean)) {
              const name = `oF_${library}_linux_${process.env.ARCH}_gcc10.tar.bz2`;
              const old = assets.find(asset => asset.name === name);
              if (old) await github.rest.repos.deleteReleaseAsset({...context.repo, asset_id: old.id});
              const data = fs.readFileSync(`out/${name}`);
              await github.rest.repos.uploadReleaseAsset({...context.repo, release_id: release.id, name, data, headers: {'content-type': 'application/octet-stream', 'content-length': data.length}});
            }

      - name: Download verified Linux build plan
        if: github.event_name == 'push'
        uses: actions/download-artifact@v8
        with:
          name: build-plan-${{ github.workflow }}
          path: ${{ runner.temp }}/build-plans
      - name: Record final release outputs
        if: github.repository == 'openframeworks/apothecary' && github.event_name == 'push'
        uses: actions/github-script@v9.0.0
        env:
          BUILD_PLAN_MATRIX: ${{ toJSON(matrix) }}
        with:
          github-token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            await require(`${process.env.GITHUB_WORKSPACE}/scripts/release-build-plan.cjs`).record({github, context, core, workflow: '.github/workflows/build-linux-modular.yml', job: 'build', matrix: JSON.parse(process.env.BUILD_PLAN_MATRIX)});
