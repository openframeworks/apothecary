name: build-linux-modular

on:
  workflow_dispatch:
  push:
    branches: [bleeding, master]
    paths-ignore: ['**/*.md']
  pull_request:
    paths-ignore: ['**/*.md']

concurrency:
  group: ${{ github.workflow }}-${{ startsWith(github.ref, 'refs/tags/') && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: write
  actions: read

jobs:
  pre-check:
    runs-on: ubuntu-latest
    outputs:
      workflow_disabled: ${{ steps.plan.outputs.workflow_disabled }}
      build_needed: ${{ steps.plan.outputs.build_needed }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Plan selected formula and toolchain builds
        id: plan
        uses: actions/github-script@v9.0.0
        with:
          script: |
            await require(`${process.env.GITHUB_WORKSPACE}/scripts/release-build-plan.cjs`).plan({github, context, core, workflow: '.github/workflows/build-linux-modular.yml', job: 'build'});
      - uses: actions/upload-artifact@v7.0.0
        with:
          name: build-plan-${{ github.workflow }}
          path: .build-plans/*.json
          include-hidden-files: true
          if-no-files-found: ignore
  build:
    needs: pre-check
    if: needs.pre-check.outputs.build_needed == 'true'
    name: ${{ matrix.library }} Linux modular - ${{ matrix.arch }} - GCC14
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.pre-check.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    env:
      TARGET: linux
      TYPE: linux
      ARCH: ${{ matrix.arch }}
      GCC: gcc14
      GCC_VERSION: '14'
      CC: gcc-14
      CXX: g++-14
      NO_FORCE: 1
      # dawn: deferred — git fetch of the pinned SHA fails in ~9s on this runner
      FORMULAS_OVERRIDE: ${{ matrix.library }}
      PACKAGE_LIBS: ${{ matrix.library }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake build-essential ccache cmake curl dos2unix flex \
            g++-14 gcc-14 git gperf libasound2-dev libegl1-mesa-dev \
            libfftw3-dev libfontconfig1-dev libgl1-mesa-dev libglu1-mesa-dev \
            libjack-dev libpulse-dev libtool libudev-dev libwayland-dev \
            libx11-dev libxcursor-dev libxext-dev libxi-dev libxinerama-dev \
            libxkbcommon-dev libxrandr-dev meson ninja-build perl pkg-config \
            python3 python3-pip unzip xorg-dev \
            libgtk-3-dev libavcodec-dev libavformat-dev libavutil-dev libswscale-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - name: Restore compatible platform artifacts
        id: platform-artifacts
        continue-on-error: true
        uses: ./.github/actions/platform-artifacts
        with:
          phase: restore
          variant: ${{ matrix.library }}-${{ matrix.arch }}
          archs: ${{ matrix.arch }}

      - name: Build modular libraries
        run: scripts/build.sh

      - name: Publish platform artifact baseline
        if: github.event_name == 'push' && steps.platform-artifacts.outcome == 'success'
        continue-on-error: true
        uses: ./.github/actions/platform-artifacts
        with:
          phase: save
          variant: ${{ matrix.library }}-${{ matrix.arch }}
          archs: ${{ matrix.arch }}

      - name: Package modular libraries
        if: github.event_name == 'push'
        env:
          ALWAYS_BUILD: 1
        run: scripts/package-individual.sh

      - name: Upload modular library asset
        if: github.repository == 'openframeworks/apothecary' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
        run: gh release upload latest-modular "out/oF_${{ matrix.library }}_linux_${{ matrix.arch }}_gcc14.tar.bz2" --clobber --repo "$GITHUB_REPOSITORY"

      - name: Download verified Linux build plan
        if: github.event_name == 'push'
        uses: actions/download-artifact@v8
        with:
          name: build-plan-${{ github.workflow }}
          path: ${{ runner.temp }}/build-plans
      - name: Record final release outputs
        if: github.repository == 'openframeworks/apothecary' && github.event_name == 'push'
        uses: actions/github-script@v9.0.0
        env:
          BUILD_PLAN_MATRIX: ${{ toJSON(matrix) }}
        with:
          script: |
            await require(`${process.env.GITHUB_WORKSPACE}/scripts/release-build-plan.cjs`).record({github, context, core, workflow: '.github/workflows/build-linux-modular.yml', job: 'build', matrix: JSON.parse(process.env.BUILD_PLAN_MATRIX)});
