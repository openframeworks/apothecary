name: build-msys2

on:
  push:
    branches: [bleeding, master]
    tags: ['**', '!latest', '!latest-modular', '!nightly', '!build-state', '!nightly-staging-*', '!nightly-previous-*']
    paths-ignore:
    - '**/*.md'
  pull_request:
    paths-ignore:
    - '**/*.md'
    
concurrency:
  group: ${{ github.workflow }}-${{ startsWith(github.ref, 'refs/tags/') && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: write
  actions: read

env:
  # Bump for compiler/SDK setup or build-command changes not declared below.
  BUILD_PROFILE_ID: "1"
  TARGET: "msys2"
  NO_FORCE: 1
  GA_CI_SECRET: ${{ secrets.CI_SECRET }}
  USE_ARTIFACT: true
  DISABLE_WORKFLOW: "false"
  
jobs:  
  pre-check:
    runs-on: ubuntu-latest
    outputs:
      workflow_disabled: ${{ steps.plan.outputs.workflow_disabled }}
      build_needed: ${{ steps.plan.outputs.build_needed }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Plan selected formula and toolchain builds
        id: plan
        uses: actions/github-script@v9.0.0
        with:
          script: |
            await require(`${process.env.GITHUB_WORKSPACE}/scripts/release-build-plan.cjs`).plan({github, context, core, workflow: '.github/workflows/build-msys2.yml', job: 'build-msys2'});
      - uses: actions/upload-artifact@v7.0.0
        with:
          name: build-plan-${{ github.workflow }}
          path: .build-plans/*.pkl
          include-hidden-files: true
          if-no-files-found: ignore
  build-msys2:
    if: needs.pre-check.outputs.build_needed == 'true'
    needs: pre-check
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.pre-check.outputs.matrix) }}
    name: ${{ matrix.flavor }}
    runs-on: ${{ matrix.flavor == 'clangarm64' && 'windows-11-arm' || 'windows-latest' }}
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Setup msys2
        uses: msys2/setup-msys2@v2.32.0
        with:
          update: true
          # windows-latest has C:\msys64 already. windows-11-arm does not,
          # so clangarm64 needs a fresh installer (msys2-arm64).
          release: ${{ matrix.flavor == 'clangarm64' }}
          cache: true
          msystem: ${{ matrix.flavor }}
          install: >-
            base-devel
            pacman-contrib
            unzip
            dos2unix
            git
            curl
            cmake
          pacboy: >-
            gcc:p
            cmake:p
            ninja:p
            gperf:p
            libxml2:p
            python3:p
            libpng:p
            zlib:p

      - name: Use system curl for clangarm64
        if: matrix.flavor == 'clangarm64'
        run: |
          # Prepend the system binary directory so that the native curl is found first
          export PATH="/usr/bin:$PATH"
          echo "Using system curl at: $(which curl)"
          # You might also want to remove or rename the problematic clangarm64 curl if necessary

      - name: Determine Release
        id: vars
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "RELEASE=${{ github.ref_name }}" >> $GITHUB_ENV
          elif [[ "${{ github.ref }}" == "refs/heads/master" ]]; then
            echo "RELEASE=nightly" >> $GITHUB_ENV
          elif [[ "${{ github.ref }}" == "refs/heads/bleeding" ]]; then
            echo "RELEASE=latest" >> $GITHUB_ENV
          else
            echo "RELEASE=latest" >> $GITHUB_ENV
          fi

      - name: Setup Environment
        run: |
          echo "Setting up environment for ${{ matrix.flavor }}"
          echo "ARCH=${{ matrix.flavor }}" >> $GITHUB_ENV

      - run: git config --global core.autocrlf input
      - name: Clone repository
        uses: actions/checkout@v7.0.1

      - name: Restore compatible platform artifacts
        id: platform-artifacts
        if: env.USE_ARTIFACT == 'true'
        continue-on-error: true
        uses: ./.github/actions/platform-artifacts
        with:
          phase: restore
          variant: ${{ matrix.flavor }}
          archs: ${{ matrix.flavor }}
          shell: msys2 {0}
      - name: Build
        working-directory: ${{env.GITHUB_WORKSPACE}}
        run: scripts/build.sh
      - name: Publish platform artifact baseline
        continue-on-error: true
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/bleeding') && env.USE_ARTIFACT == 'true' && steps.platform-artifacts.outcome == 'success'
        uses: ./.github/actions/platform-artifacts
        with:
          phase: save
          variant: ${{ matrix.flavor }}
          archs: ${{ matrix.flavor }}
          shell: msys2 {0}
      - name: Package
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/bleeding' || contains(github.ref, 'refs/tags/'))
        working-directory: ${{ env.GITHUB_WORKSPACE }}
        run: scripts/package.sh
      - name: List output directory2
        run: ls -lah out/
      - name: Update Release
        if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/bleeding')
        uses: danoli3/action-gh-release@ec40b04e78c39008f73c4ca3fdf9b51df604c4ed # temporary patch: softprops/action-gh-release#852
        with:
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          tag_name: ${{ env.RELEASE }}
          draft: false
          fail_on_unmatched_files: true
          files: out/openFrameworksLibs_${{ env.RELEASE }}_${{ env.TARGET }}_${{ matrix.flavor }}.zip

      - name: Download verified Linux build plan
        if: github.event_name == 'push' && (github.ref == 'refs/heads/bleeding' || github.ref == 'refs/heads/master')
        uses: actions/download-artifact@v8
        with:
          name: build-plan-${{ github.workflow }}
          path: ${{ runner.temp }}/build-plans
      - name: Record final release outputs
        if: github.event_name == 'push' && (github.ref == 'refs/heads/bleeding' || github.ref == 'refs/heads/master')
        uses: actions/github-script@v9.0.0
        env:
          BUILD_PLAN_MATRIX: ${{ toJSON(matrix) }}
        with:
          github-token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            await require(`${process.env.GITHUB_WORKSPACE}/scripts/release-build-plan.cjs`).record({github, context, core, workflow: '.github/workflows/build-msys2.yml', job: 'build-msys2', matrix: JSON.parse(process.env.BUILD_PLAN_MATRIX)});
