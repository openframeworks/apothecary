name: build-vs2026

on:
  workflow_dispatch:
  push:
    branches: [bleeding, master]
    tags: ['**', '!latest', '!latest-modular', '!nightly', '!build-state', '!nightly-staging-*', '!nightly-previous-*']
    paths-ignore:
      - '**/*.md'
  pull_request:
    paths-ignore:
      - '**/*.md'

concurrency:
  group: ${{ github.workflow }}-${{ startsWith(github.ref, 'refs/tags/') && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  actions: read
  contents: write

env:
  # Bump for compiler/SDK setup or build-command changes not declared below.
  BUILD_PROFILE_ID: "1"
  TARGET: "vs"
  VS_STUDIO: "2026"
  VS_VER: 18
  NO_FORCE: 1
  GA_CI_SECRET: ${{ secrets.CI_SECRET }}
  USE_ARTIFACT: true
  DISABLE_WORKFLOW: "false"

jobs:
  pre-check:
    runs-on: ubuntu-latest
    outputs:
      workflow_disabled: ${{ steps.plan.outputs.workflow_disabled }}
      build_needed: ${{ steps.plan.outputs.build_needed }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Plan selected formula and toolchain builds
        id: plan
        uses: actions/github-script@v9.0.0
        with:
          script: |
            await require(`${process.env.GITHUB_WORKSPACE}/scripts/release-build-plan.cjs`).plan({github, context, core, workflow: '.github/workflows/build-vs2026-x64.yml', job: 'build-vs2026'});
      - uses: actions/upload-artifact@v7.0.0
        with:
          name: build-plan-${{ github.workflow }}
          path: .build-plans/*.pkl
          include-hidden-files: true
          if-no-files-found: ignore
  build-vs2026:
    if: needs.pre-check.outputs.build_needed == 'true'
    needs: pre-check
    runs-on: windows-2025-vs2026
    strategy:
      matrix: ${{ fromJSON(needs.pre-check.outputs.matrix) }}
    defaults:
      run:
        shell: msys2 {0}

    env:
      ARCH: ${{ matrix.arch }}

    steps:
      - name: Check if Workflow is disabled
        shell: bash
        run: |
          if [ "${{ env.DISABLE_WORKFLOW }}" == "true" ]; then
            echo "Workflow is disabled. Exiting."
            exit 78
          fi

      - name: Setup msys2
        uses: msys2/setup-msys2@v2.32.0
        with:
          update: true
          install: >-
            base-devel unzip dos2unix gperf git mingw-w64-x86_64-python
            mingw-w64-x86_64-binutils mingw-w64-x86_64-clang
            mingw-w64-x86_64-gcc mingw-w64-x86_64-gcc-libs
            mingw-w64-x86_64-cmake mingw-w64-x86_64-gdb
            mingw-w64-x86_64-make
            mingw-w64-x86_64-meson mingw-w64-x86_64-ninja

      - name: Clone repository
        uses: actions/checkout@v7.0.1

      - name: Restore Apothecary build cache
        uses: actions/cache@v5
        with:
          path: apothecary/build
          key: apothecary-vs${{ env.VS_VER }}-${{ matrix.arch }}-bundle-${{ matrix.bundle }}-${{ hashFiles('apothecary/formulas/**', 'apothecary/apothecary', 'scripts/build.sh', 'scripts/calculate_formulas.sh', 'scripts/vs/**') }}

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Determine Release
        id: vars
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "RELEASE=${{ github.ref_name }}" >> $GITHUB_ENV
          elif [[ "${{ github.ref }}" == "refs/heads/master" ]]; then
            echo "RELEASE=nightly" >> $GITHUB_ENV
          elif [[ "${{ github.ref }}" == "refs/heads/bleeding" ]]; then
            echo "RELEASE=latest" >> $GITHUB_ENV
          else
            echo "RELEASE=latest" >> $GITHUB_ENV
          fi

      - name: Scripts Install
        run: ./scripts/vs/install.sh

      # ── Download artifacts (if enabled) ─────────────────────────────────────
      - name: Restore compatible platform artifacts
        id: platform-artifacts
        env:
          BUNDLE: ${{ matrix.bundle }}
        continue-on-error: true
        if: env.USE_ARTIFACT == 'true'
        uses: ./.github/actions/platform-artifacts
        with:
          phase: restore
          variant: ${{ env.ARCH }}-${{ matrix.bundle }}
          archs: ${{ env.ARCH }}
          shell: msys2 {0}
      - name: List output directory
        if: env.USE_ARTIFACT == 'true'
        run: ls -lah out/

      # ── Build ───────────────────────────────────────────────────────────────
      - name: Build ${{ matrix.arch }}
        working-directory: ${{env.GITHUB_WORKSPACE}}
        run: scripts/build.sh
        env:
          BUNDLE: ${{ matrix.bundle }}

      # ── Package (always for VS2026 preview) ─────────────────────────────────
      - name: Publish platform artifact baseline
        env:
          BUNDLE: ${{ matrix.bundle }}
        continue-on-error: true
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/bleeding') && env.USE_ARTIFACT == 'true' && steps.platform-artifacts.outcome == 'success'
        uses: ./.github/actions/platform-artifacts
        with:
          phase: save
          variant: ${{ env.ARCH }}-${{ matrix.bundle }}
          archs: ${{ env.ARCH }}
          shell: msys2 {0}
      - name: Package
        working-directory: ${{ env.GITHUB_WORKSPACE }}
        run: scripts/package.sh
        env:
          BUNDLE: ${{ matrix.bundle }}
          ALWAYS_BUILD: true

      - name: List output directory (post-package)
        run: ls -lah out/

      # ── Upload & Release (only on push to master/bleeding/tags) ─────────────
      - name: Upload binaries as Artifact
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/bleeding')
        uses: actions/upload-artifact@v7.0.0
        with:
          name: libs-${{ env.RELEASE }}-${{ env.TARGET }}-${{ env.VS_STUDIO }}-${{ matrix.arch }}-${{ matrix.bundle }}
          path: out/openFrameworksLibs_${{ env.RELEASE }}_${{ env.TARGET }}_${{ env.VS_STUDIO }}_${{ matrix.arch }}_${{ matrix.bundle }}.zip
          retention-days: 31

      - name: Update GitHub Release
        if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/bleeding')
        uses: danoli3/action-gh-release@ec40b04e78c39008f73c4ca3fdf9b51df604c4ed # temporary patch: softprops/action-gh-release#852
        with:
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          tag_name: ${{ env.RELEASE }}
          draft: false
          files: out/openFrameworksLibs_${{ env.RELEASE }}_${{ env.TARGET }}_${{ env.VS_STUDIO }}_${{ matrix.arch }}_${{ matrix.bundle }}.zip

      - name: Download verified Linux build plan
        if: github.event_name == 'push' && (github.ref == 'refs/heads/bleeding' || github.ref == 'refs/heads/master')
        uses: actions/download-artifact@v8
        with:
          name: build-plan-${{ github.workflow }}
          path: ${{ runner.temp }}/build-plans
      - name: Record final release outputs
        if: github.event_name == 'push' && (github.ref == 'refs/heads/bleeding' || github.ref == 'refs/heads/master')
        uses: actions/github-script@v9.0.0
        env:
          BUILD_PLAN_MATRIX: ${{ toJSON(matrix) }}
        with:
          github-token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            await require(`${process.env.GITHUB_WORKSPACE}/scripts/release-build-plan.cjs`).record({github, context, core, workflow: '.github/workflows/build-vs2026-x64.yml', job: 'build-vs2026', matrix: JSON.parse(process.env.BUILD_PLAN_MATRIX)});
