name: Build and release openFrameworks libraries

on:
  workflow_dispatch:
    inputs:
      openframeworks_version:
        description: "openFrameworks version to release (for example 12.2.0)"
        required: true
        type: string
      overwrite_existing:
        description: "Move an existing version tag to latest and replace its archives with current latest zips. Keeps the GitHub Release; same filenames are overwritten in place."
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: openframeworks-release-${{ inputs.openframeworks_version }}
  cancel-in-progress: false

jobs:
  create-release-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the latest build
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          ref: latest
          # Prefer PAT so a tag push can start build-* workflows. GITHUB_TOKEN
          # is enough to move the tag and replace release archives.
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Validate and resolve version
        id: release
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.openframeworks_version }}
        run: |
          set -euo pipefail

          version="${INPUT_VERSION#v}"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "Version must look like 12.2.0 (an optional leading v and prerelease suffix are accepted)." >&2
            exit 1
          fi

          tag="v${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Check existing release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          OVERWRITE_EXISTING: ${{ inputs.overwrite_existing }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            if [[ "${OVERWRITE_EXISTING}" != "true" ]]; then
              echo "Tag ${RELEASE_TAG} already exists. Enable 'overwrite existing' to move and rebuild it." >&2
              exit 1
            fi
            echo "Tag ${RELEASE_TAG} exists and will be moved to $(git rev-parse HEAD)."
          fi

      - name: Create and push release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f -a "$RELEASE_TAG" -m "openFrameworks ${RELEASE_VERSION} libraries"
          if [[ "${{ inputs.overwrite_existing }}" == "true" ]]; then
            git push origin "refs/tags/${RELEASE_TAG}" --force
          else
            git push origin "refs/tags/${RELEASE_TAG}"
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          SOURCE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          title="openFrameworks ${RELEASE_VERSION} libraries"
          notes="Precompiled openFrameworks libraries built from the latest revision (${SOURCE_SHA}). Platform assets are added by the build workflows as they complete."
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "$title" --notes "$notes"
          else
            gh release create "$RELEASE_TAG" \
              --verify-tag \
              --title "$title" \
              --notes "$notes"
          fi

      - name: Replace archives from latest
        if: ${{ inputs.overwrite_existing }}
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p latest-assets renamed
          gh release download latest --dir latest-assets --pattern 'openFrameworksLibs_latest_*'
          gh release download latest --dir latest-assets --pattern 'vs2019-*' || true
          shopt -s nullglob
          count=0
          for src in latest-assets/*; do
            base="$(basename "$src")"
            dest="${base//openFrameworksLibs_latest_/openFrameworksLibs_${RELEASE_TAG}_}"
            if [[ "$dest" == *.manifest.json ]]; then
              sed "s/openFrameworksLibs_latest_/openFrameworksLibs_${RELEASE_TAG}_/g" "$src" > "renamed/$dest"
            else
              mv "$src" "renamed/$dest"
            fi
            count=$((count + 1))
          done
          if [[ "$count" -eq 0 ]]; then
            echo "No latest archives found to copy onto ${RELEASE_TAG}." >&2
            exit 1
          fi
          gh release upload "$RELEASE_TAG" renamed/* --clobber
          echo "Uploaded ${count} archives from latest onto ${RELEASE_TAG}."

      - name: Summary
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          SOURCE_SHA: ${{ steps.release.outputs.sha }}
          OVERWRITE_EXISTING: ${{ inputs.overwrite_existing }}
        run: |
          {
            echo "## Release started"
            echo
            echo "Created \`${RELEASE_TAG}\` from \`latest\` at \`${SOURCE_SHA}\`."
            if [[ "${OVERWRITE_EXISTING}" == "true" ]]; then
              echo "Existing GitHub Release was kept. Archives were replaced with current \`latest\` assets of the same name."
              echo "A PAT_TOKEN tag push may also start platform rebuilds; GITHUB_TOKEN alone does not."
            else
              echo "The tag push starts platform build workflows when PAT_TOKEN is configured; each successful build uploads its archive to this release."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
