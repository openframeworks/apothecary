name: build-xros

on:
  workflow_dispatch:
  push:
    branches: [bleeding, master]
    tags: ['**']
    paths-ignore:
      - '**/README.md'
  pull_request:
    paths-ignore:
      - '**/README.md'

concurrency:
  group: ${{ github.workflow }}-${{ startsWith(github.ref, 'refs/tags/') && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: write
  actions: read

env:
  TARGET: "xros"
  NO_FORCE: 1
  GA_CI_SECRET: ${{ secrets.CI_SECRET }}
  USE_ARTIFACT: true
  DISABLE_WORKFLOW: "false"

jobs:
  pre-check:
    runs-on: ubuntu-latest
    outputs:
      workflow_disabled: ${{ steps.check-disabled.outputs.disabled }}
    steps:
    - name: Check if Workflow is disabled
      id: check-disabled
      shell: bash
      run: |
        if [ "${{ env.DISABLE_WORKFLOW }}" == "true" ]; then
          echo "disabled=true" >> "$GITHUB_OUTPUT"
        else
          echo "disabled=false" >> "$GITHUB_OUTPUT"
        fi
  build-xros-platforms:
    if: needs.pre-check.outputs.workflow_disabled != 'true'
    runs-on: macos-26
    needs: pre-check
    strategy:
      matrix:
        bundle: [1, 2, 3]
    env:
      TARGET: "xros"
      BUNDLE: ${{ matrix.bundle }}
      DEVELOPER_DIR: "/Applications/Xcode_26.6.app/Contents/Developer"
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Determine Release
        id: vars
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "RELEASE=${{ github.ref_name }}" >> $GITHUB_ENV
          elif [[ "${{ github.ref }}" == "refs/heads/master" ]]; then
            echo "RELEASE=nightly" >> $GITHUB_ENV
          elif [[ "${{ github.ref }}" == "refs/heads/bleeding" ]]; then
            echo "RELEASE=latest" >> $GITHUB_ENV
          else
            echo "RELEASE=latest" >> $GITHUB_ENV
          fi
      - name: Scripts Calc Formula - ${{ env.TARGET }} Bundle ${{ matrix.bundle }}
        run: ./scripts/calculate_formulas.sh
      - name: Scripts Install
        run: ./scripts/xros/install.sh
      - name: Restore compatible platform artifacts
        id: platform-artifacts
        if: env.USE_ARTIFACT == 'true'
        continue-on-error: true
        uses: ./.github/actions/platform-artifacts
        with:
          phase: restore
          variant: ${{ matrix.bundle }}
          archs: arm64 x86_64 SIM_arm64
      - name: Build VisionOS
        working-directory: ${{ env.GITHUB_WORKSPACE }}
        run: scripts/build.sh
        env:
          TARGET: "xros"
          BUNDLE: ${{ matrix.bundle }}
          ARCH: arm64
          GA_CI_SECRET: ${{ secrets.CI_SECRET }}
      - name: Build VisionOS
        working-directory: ${{ env.GITHUB_WORKSPACE }}
        run: scripts/build.sh
        env:
          TARGET: "xros"
          BUNDLE: ${{ matrix.bundle }}
          ARCH: x86_64
          GA_CI_SECRET: ${{ secrets.CI_SECRET }}
      - name: Build VisionOS SIMULATOR arm64
        working-directory: ${{ env.GITHUB_WORKSPACE }}
        run: scripts/build.sh
        env:
          TARGET: "xros"
          BUNDLE: ${{ matrix.bundle }}
          ARCH: SIM_arm64
          GA_CI_SECRET: ${{ secrets.CI_SECRET }}
      - name: Publish platform artifact baseline
        continue-on-error: true
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/bleeding') && env.USE_ARTIFACT == 'true' && steps.platform-artifacts.outcome == 'success'
        uses: ./.github/actions/platform-artifacts
        with:
          phase: save
          variant: ${{ matrix.bundle }}
          archs: arm64 x86_64 SIM_arm64
      - name: List output directory
        run: ls -lah out/
      - name: Merge our VisionOS libaries into XC Framework 
        working-directory: ${{ env.GITHUB_WORKSPACE }}
        run: scripts/xros/xcframework_all.sh
        env:
          BUNDLE: ${{ matrix.bundle }}
          GA_CI_SECRET: ${{ secrets.CI_SECRET }}
      - name: Package XCFramework
        if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/bleeding')
        working-directory: ${{ env.GITHUB_WORKSPACE }}
        run: scripts/package.sh
        env:
          BUNDLE: ${{ matrix.bundle }}
          GA_CI_SECRET: ${{ secrets.CI_SECRET }}
      - name: Update Release XCFramework
        if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/bleeding')
        uses: softprops/action-gh-release@v3.0.3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ env.RELEASE }}
          files: xout/openFrameworksLibs_${{ env.RELEASE }}_${{ env.TARGET }}_${{ matrix.bundle }}.tar.bz2
