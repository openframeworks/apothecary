name: SDK Version check
on:
  schedule:
    - cron: '15 8 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/sdk-versions.yml'
      - '.github/workflows/**'
      - '.github/actions/**'
      - 'apothecary/apothecary'
      - 'scripts/build-matrices.json'
      - 'scripts/check-sdk-toolchains.py'
      - 'scripts/tests/test-sdk-toolchains.py'
      - 'scripts/check-sdk-versions.sh'
      - 'scripts/sdk-versions.json'
      - 'scripts/check-upstream-versions.sh'
      - 'scripts/upstream-versions.jq'
      - 'scripts/tests/test-sdk-versions.sh'
  push:
    branches: [bleeding]
    paths:
      - '.github/workflows/sdk-versions.yml'
      - '.github/workflows/**'
      - '.github/actions/**'
      - 'apothecary/apothecary'
      - 'scripts/build-matrices.json'
      - 'scripts/check-sdk-toolchains.py'
      - 'scripts/tests/test-sdk-toolchains.py'
      - 'scripts/check-sdk-versions.sh'
      - 'scripts/sdk-versions.json'
      - 'scripts/check-upstream-versions.sh'
      - 'scripts/upstream-versions.jq'
      - 'scripts/tests/test-sdk-versions.sh'
permissions:
  contents: read
concurrency:
  group: sdk-versions-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: bash scripts/tests/test-upstream-versions.sh
      - run: bash scripts/tests/test-sdk-versions.sh
      - run: python3 scripts/tests/test-sdk-toolchains.py
  check:
    needs: test
    if: github.repository == 'openframeworks/apothecary' && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: bleeding
      - name: Compare SDK versions and maintain SDK tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash scripts/check-sdk-versions.sh --file-issue
