name: Validate platform artifact reuse
on:
  pull_request:
    paths:
      - '.github/workflows/build*.yml'
      - '.github/actions/platform-artifacts/**'
      - 'scripts/*artifact*'
      - 'scripts/package*.sh'
      - 'scripts/build.sh'
      - 'scripts/build-timings.sh'
      - 'scripts/tests/test-build-timings.sh'
      - 'scripts/tests/test-package-platforms.sh'
      - 'apothecary/formulas/metalangle/**'
      - 'scripts/tests/test-metalangle-fetch.sh'
      - 'scripts/modular-cache-key.sh'
      - 'scripts/cache-toolchain.sh'
      - 'scripts/apple-install-tools.sh'
      - 'scripts/macos/install.sh'
      - 'scripts/tests/test-apple-install-tools.sh'
      - 'scripts/release-*'
      - 'scripts/build-matrices.json'
      - 'scripts/tests/test-release-build-plan.cjs'
      - 'scripts/tests/test-release-plan-summary.cjs'
      - 'scripts/tests/test-*cache*'
      - 'scripts/tests/test-platform-artifacts.cjs'
      - 'scripts/tests/test-workflow-scheduling.rb'
      - '.github/workflows/validate-platform-artifacts.yml'
  push:
    branches: [bleeding, master]
    paths:
      - '.github/workflows/build*.yml'
      - '.github/actions/platform-artifacts/**'
      - 'scripts/*artifact*'
      - 'scripts/package*.sh'
      - 'scripts/build.sh'
      - 'scripts/build-timings.sh'
      - 'scripts/tests/test-build-timings.sh'
      - 'scripts/tests/test-package-platforms.sh'
      - 'apothecary/formulas/metalangle/**'
      - 'scripts/tests/test-metalangle-fetch.sh'
      - 'scripts/modular-cache-key.sh'
      - 'scripts/cache-toolchain.sh'
      - 'scripts/apple-install-tools.sh'
      - 'scripts/macos/install.sh'
      - 'scripts/tests/test-apple-install-tools.sh'
      - 'scripts/release-*'
      - 'scripts/build-matrices.json'
      - 'scripts/tests/test-release-build-plan.cjs'
      - 'scripts/tests/test-release-plan-summary.cjs'
      - 'scripts/tests/test-*cache*'
      - 'scripts/tests/test-platform-artifacts.cjs'
      - 'scripts/tests/test-workflow-scheduling.rb'
      - '.github/workflows/validate-platform-artifacts.yml'
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: bash -n scripts/platform-artifact-manifest.sh scripts/modular-cache-key.sh scripts/cache-toolchain.sh
      - run: bash scripts/tests/test-modular-cache.sh
      - run: bash scripts/tests/test-apple-install-tools.sh
      - run: node scripts/tests/test-platform-artifacts.cjs
      - run: ruby scripts/tests/test-workflow-scheduling.rb
      - run: node scripts/tests/test-release-build-plan.cjs
      - run: bash scripts/tests/test-package-platforms.sh
      - run: bash scripts/tests/test-metalangle-fetch.sh
      - run: node scripts/tests/test-release-plan-summary.cjs
      - run: bash -n scripts/build.sh scripts/build-timings.sh scripts/tests/test-build-timings.sh
      - run: bash scripts/tests/test-build-timings.sh
      - run: bash scripts/tests/test-msys2-install.sh
