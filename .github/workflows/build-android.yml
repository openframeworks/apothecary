name: build-android

on:
  push:
    branches: [bleeding, master]
    tags: ['**']
    paths-ignore:
      - '**/README.md'
  pull_request:
    paths-ignore:
      - '**/README.md'

env:
  TARGET: "android"
  NO_FORCE: 1
  GA_CI_SECRET: ${{ secrets.CI_SECRET }}
  USE_ARTIFACT: true
  DISABLE_WORKFLOW: "false"

concurrency:
  group: ${{ github.workflow }}-${{ startsWith(github.ref, 'refs/tags/') && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: write
  actions: read

jobs:
  pre-check:
    runs-on: ubuntu-latest
    outputs:
      workflow_disabled: ${{ steps.check-disabled.outputs.disabled }}
    steps:
    - name: Check if Workflow is disabled
      id: check-disabled
      shell: bash
      run: |
        if [ "${{ env.DISABLE_WORKFLOW }}" == "true" ]; then
          echo "disabled=true" >> "$GITHUB_OUTPUT"
        else
          echo "disabled=false" >> "$GITHUB_OUTPUT"
        fi
  build-android-platforms:
    if: needs.pre-check.outputs.workflow_disabled != 'true'
    needs: pre-check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ARCH: [armv7, arm64, x86_64]
        # ubuntu-24.04 image (20260907): NDK 27.3 default, 28.2, 29.0 latest;
        # build-tools 37.0.0; platforms through android-37. Pin the latest NDK/SDK
        # on the image. ANDROID_API is the *min* compile target (not the SDK).
        SDK: ["37.0.0"]
        NDK: ["29.0.14206865"]
        API: ["25"]
    env:
      ARCH: ${{ matrix.ARCH }}
      SDK: ${{ matrix.SDK }}
      NDK: ${{ matrix.NDK }}
      ANDROID_API: ${{ matrix.API }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Determine Release
        id: vars
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "RELEASE=${{ github.ref_name }}" >> $GITHUB_ENV
          elif [[ "${{ github.ref }}" == "refs/heads/master" ]]; then
            echo "RELEASE=nightly" >> $GITHUB_ENV
          elif [[ "${{ github.ref }}" == "refs/heads/bleeding" ]]; then
            echo "RELEASE=latest" >> $GITHUB_ENV
          else
            echo "RELEASE=latest" >> $GITHUB_ENV
          fi
      - name: Scripts Setup
        run: ./scripts/$TARGET/setup.sh
      - name: Scripts Calc Formula Android - ${{ matrix.ARCH }}
        run: ./scripts/calculate_formulas.sh
      - name: Scripts Install
        run: ./scripts/$TARGET/install.sh
      - name: Restore compatible platform artifacts
        id: platform-artifacts
        if: env.USE_ARTIFACT == 'true'
        continue-on-error: true
        uses: ./.github/actions/platform-artifacts
        with:
          phase: restore
          variant: ${{ matrix.ARCH }}
          archs: ${{ matrix.ARCH }}
      - name: build
        run: ./scripts/build.sh
        env:
          GA_CI_SECRET: ${{ secrets.CI_SECRET }}
          ARCH: ${{ matrix.ARCH }}
          NDK: ${{ matrix.NDK }}
      - name: List output directory
        run: ls -lah out/

      - name: Publish platform artifact baseline
        continue-on-error: true
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/bleeding') && env.USE_ARTIFACT == 'true' && steps.platform-artifacts.outcome == 'success'
        uses: ./.github/actions/platform-artifacts
        with:
          phase: save
          variant: ${{ matrix.ARCH }}
          archs: ${{ matrix.ARCH }}
      - name: Generate Summary
        run: |
          chmod +x ./scripts/summary.sh
          ./scripts/summary.sh

      - name: Package
        if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/bleeding')
        working-directory: ${{ env.GITHUB_WORKSPACE }}
        run: scripts/package.sh
        env:
          GA_CI_SECRET: ${{ secrets.CI_SECRET }}
      - name: Update Release emscripten
        if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/bleeding')
        uses: softprops/action-gh-release@v3.0.3
        with:
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          tag_name: ${{ env.RELEASE }}
          files: out/openFrameworksLibs_${{ env.RELEASE }}_android_${{ matrix.ARCH }}.tar.bz2
