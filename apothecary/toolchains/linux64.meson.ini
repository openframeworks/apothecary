[host_machine]
system = 'linux'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'

[binaries]
c = 'gcc-14'
cpp = 'g++-14'
ar = 'x86_64-linux-gnu-ar'
strip = 'x86_64-linux-gnu-strip'
pkgconfig = 'x86_64-linux-gnu-pkg-config'
ld = 'x86_64-linux-gnu-ld'
nm = 'x86_64-linux-gnu-nm'
ranlib = 'x86_64-linux-gnu-ranlib'
objcopy = 'x86_64-linux-gnu-objcopy'
objdump = 'x86_64-linux-gnu-objdump'

[properties]
sys_root = '/'
c_args = ['--sysroot=/', '-fPIC', '-O3', '-Wall', '-Wextra', '-march=x86-64', '-mtune=generic', '-Wl,-rpath-link,/', '-L/lib/', '-L/lib64/', '-L/lib/x86_64-linux-gnu']
cpp_args = ['--sysroot=/', '-fPIC', '-O3', '-Wall', '-Wextra', '-std=c++17', '-march=x86-64', '-mtune=generic', '-Wl,-rpath-link,/', '-L/lib/', '-L/lib64/', '-L/lib/x86_64-linux-gnu']
c_link_args = ['-fPIE', '-pie', '-Wl,-rpath-link,/', '-L/lib/', '-L/lib64/', '-L/lib/x86_64-linux-gnu' , '-lm' ]
cpp_link_args = ['-fPIE', '-pie', '-Wl,-rpath-link,/', '-L/lib/', '-L/lib64/', '-L/lib/x86_64-linux-gnu' , '-lm' ]

[build_options]
c_std = 'c17'
cpp_std = 'c++17'
default_library = 'static'
