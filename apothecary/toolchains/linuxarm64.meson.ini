[host_machine]
system = 'linux'
cpu_family = 'native'
cpu = 'aarch64'
endian = 'little'

[binaries]
c = 'gcc'
cpp = 'g++'
ar = 'ar'
strip = 'strip'
pkg-config = 'pkg-config'
ld = 'ld'
nm = 'nm'
ranlib = 'ranlib'
objcopy = 'objcopy'
objdump = 'objdump'

[properties]
sys_root = '/'
c_args = ['--sysroot=/', '-I/usr/include', '-I/usr/include/aarch64-linux-gnu', '-fPIC', '-O3', '-Wall', '-Wextra', '-march=armv8-a+simd']
cpp_args = ['--sysroot=/', '-I/usr/include', '-I/usr/include/aarch64-linux-gnu', '-fPIC', '-O3', '-Wall', '-Wextra', '-std=c++17', '-march=armv8-a+simd']
c_link_args = ['-fPIE', '-pie', '-Wl,-rpath-link,/', '-L/usr/lib', '-L/lib', '-L/usr/lib/aarch64-linux-gnu', '-L/lib/aarch64-linux-gnu', '-lm']
cpp_link_args = ['-fPIE', '-pie', '-Wl,-rpath-link,/', '-L/usr/lib', '-L/lib', '-L/usr/lib/aarch64-linux-gnu', '-L/lib/aarch64-linux-gnu', '-lm']

[build_options]
c_std = 'c17'
cpp_std = 'c++17'
default_library = 'static'
