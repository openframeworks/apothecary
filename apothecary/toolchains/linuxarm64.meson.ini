[host_machine]
system = 'linux'
cpu_family = 'native'
cpu = 'aarch64'
endian = 'little'

[binaries]
c = 'gcc'
cpp = 'g++'
ar = 'ar'
strip = 'strip'
pkg-config = 'pkg-config'
ld = 'ld'
nm = 'nm'
ranlib = 'ranlib'
objcopy = 'objcopy'
objdump = 'objdump'

[properties]
sys_root = '/'
c_args = ['-I/usr/include', '-fPIC', '-O3', '-Wall', '-Wextra']
cpp_args = ['-I/usr/include', '-fPIC', '-O3', '-Wall', '-Wextra', '-std=c++17']
c_link_args = ['-fPIE', '-pie', '-L/usr/lib']
cpp_link_args = ['-fPIE', '-pie', '-L/usr/lib']

[build_options]
c_std = 'c17'
cpp_std = 'c++17'
default_library = 'static'
